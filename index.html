<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meus Afazeres</title>
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --ink:#1d2330; --muted:#6b7385; --line:#e3e6ec;
  --accent:#2563eb; --accent-soft:#e8efff; --danger:#c0392b; --ok:#1e8e3e; --warn:#b7791f;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg);display:flex}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
/* sidebar */
#side{width:220px;flex:none;background:#151a24;color:#cfd5e2;display:flex;flex-direction:column;padding:16px 10px}
#side h1{font-size:17px;color:#fff;margin:4px 10px 18px;letter-spacing:.2px}
#side nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:inherit;padding:9px 12px;border-radius:8px;margin-bottom:2px}
#side nav button:hover{background:#222939}
#side nav button.on{background:#2b3346;color:#fff;font-weight:600}
#side .ico{width:18px;text-align:center;opacity:.9}
#side .grow{flex:1}
#outlookStatus{font-size:12px;padding:10px 12px;border-radius:8px;background:#1d2332;line-height:1.4}
#outlookStatus .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
/* main */
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#top{display:flex;align-items:center;gap:10px;padding:14px 22px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
#top h2{margin:0;font-size:19px;margin-right:auto}
#filtros{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.chip .sw{width:9px;height:9px;border-radius:50%}
.chip.off{opacity:.4}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 13px}
.btn:hover{background:#f0f2f6}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.07)}
.btn.dan{color:var(--danger)}
.btn.sm{padding:4px 9px;font-size:12.5px}
#view{flex:1;overflow:auto;padding:20px 22px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px}
.card h3{margin:0 0 10px;font-size:14px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.empty{color:var(--muted);font-style:italic;padding:4px 0}
.row{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:8px;border-bottom:1px solid #f0f1f4}
.row:last-child{border-bottom:0}
.row:hover{background:#f8f9fb}
.row .time{width:92px;flex:none;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.row .bar{width:4px;align-self:stretch;border-radius:2px;flex:none}
.row .txt{flex:1;min-width:0;cursor:pointer}
.row .t{font-weight:500}
.row .s{font-size:12.5px;color:var(--muted)}
.row.done .t{text-decoration:line-through;color:var(--muted)}
.chk{width:18px;height:18px;flex:none;accent-color:var(--ok);cursor:pointer}
.tag{font-size:11px;border-radius:4px;padding:1px 6px;background:#eef0f4;color:#4a5263;margin-left:6px;white-space:nowrap}
.tag.ol{background:#e6f0ff;color:#1f4fb8}
.tag.err{background:#fdecea;color:var(--danger)}
.tag.late{background:#fff4e0;color:var(--warn)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
/* semana */
.semana{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:10px}
.dia{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px;min-height:160px}
.dia.hoje{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.dia h4{margin:0 0 8px;font-size:13px;display:flex;justify-content:space-between;align-items:baseline}
.dia h4 small{color:var(--muted);font-weight:400}
.ent{font-size:12.5px;border-left:3px solid;padding:4px 6px;margin-bottom:5px;border-radius:4px;background:#f7f8fa;cursor:pointer}
.ent.done{opacity:.5;text-decoration:line-through}
.ent b{font-weight:600;font-variant-numeric:tabular-nums}
/* calendario */
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.cal-head .lbl{font-weight:600;font-size:16px;margin:0 8px;min-width:220px}
.wk{display:grid;grid-template-columns:52px repeat(7,1fr);background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.wk .hd{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);font-size:12.5px;background:#fafbfc}
.wk .hd.hoje{color:var(--accent);font-weight:700}
.wk .ad{border-bottom:1px solid var(--line);min-height:26px;padding:2px;border-left:1px solid var(--line)}
.wk .hrs{position:relative}
.wk .hr{height:48px;font-size:11px;color:var(--muted);text-align:right;padding-right:6px;transform:translateY(-7px)}
.wk .col{position:relative;border-left:1px solid var(--line);background:repeating-linear-gradient(#fff 0 47px,#eef0f3 47px 48px)}
.wk .col.hoje{background:repeating-linear-gradient(#f7faff 0 47px,#e8edf6 47px 48px)}
.ev{position:absolute;border-radius:5px;padding:2px 5px;font-size:11.5px;overflow:hidden;color:#fff;cursor:pointer;line-height:1.25;border:1px solid rgba(255,255,255,.6)}
.ev.done{opacity:.45}
.adchip{font-size:11.5px;color:#fff;border-radius:4px;padding:1px 5px;margin:1px 0;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowline{position:absolute;left:0;right:0;height:2px;background:#e53935;z-index:3}
.mes{display:grid;grid-template-columns:repeat(7,1fr);background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.mes .hd{padding:6px;text-align:center;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.mes .cel{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;cursor:pointer}
.mes .cel.fora{background:#fafbfc;color:#aab}
.mes .cel.hoje .n{background:var(--accent);color:#fff;border-radius:50%}
.mes .n{display:inline-block;width:22px;height:22px;text-align:center;line-height:22px;font-size:12px}
.mes .mais{font-size:11px;color:var(--muted)}
/* projetos */
.proj-wrap{display:grid;grid-template-columns:280px 1fr;gap:16px;align-items:start}
.plist .area{margin-bottom:14px}
.plist .ah{display:flex;align-items:center;gap:8px;font-weight:600;padding:6px 8px;border-radius:8px;cursor:pointer}
.plist .ah:hover,.plist .pi:hover{background:#eef1f6}
.plist .ah.sel,.plist .pi.sel{background:var(--accent-soft)}
.plist .pi{padding:6px 8px 6px 28px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between}
.plist .pi small{color:var(--muted)}
.sw{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:4px 0 6px}
/* modal */
#modalBg{position:fixed;inset:0;background:rgba(15,20,30,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50}
#modalBg.on{display:flex}
#modal{background:#fff;border-radius:14px;width:min(620px,100%);padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
#modal h3{margin:0 0 14px;font-size:18px}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.f label{font-size:12.5px;color:var(--muted);font-weight:600}
.f input,.f select,.f textarea{border:1px solid #cfd4de;border-radius:8px;padding:7px 9px;background:#fff}
.f textarea{min-height:70px;resize:vertical}
.fr{display:flex;gap:12px;flex-wrap:wrap}
.fr>.f{flex:1;min-width:130px}
.dows{display:flex;gap:4px}
.dows label{border:1px solid #cfd4de;border-radius:6px;padding:4px 8px;font-size:12.5px;cursor:pointer;color:var(--ink);font-weight:500}
.dows input{display:none}
.dows input:checked+span{color:var(--accent);font-weight:700}
.dows label:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}
.cb{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;align-items:center}
.acts .l{margin-right:auto}
.box{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px;background:#fafbfc}
.hint{font-size:12.5px;color:var(--muted)}
#toast{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:#1d2330;color:#fff;padding:10px 14px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:380px;font-size:13.5px}
.toast.err{background:var(--danger)}
table.cfg{border-collapse:collapse;width:100%}
body.login #nav,body.login #btnNovo,body.login #btnReuniao{display:none}
@media (max-width:820px){
  body{flex-direction:column}
  #side{width:auto;order:2;flex-direction:row;padding:4px 6px;border-top:1px solid #2b3346}
  #side h1,#side .grow,#outlookStatus{display:none}
  #side nav{display:flex;width:100%;justify-content:space-around}
  #side nav button{flex-direction:column;gap:1px;font-size:10.5px;padding:6px 4px;width:auto;margin:0}
  #main{order:1;min-height:0}
  #top{padding:10px 12px;gap:6px}
  #top h2{font-size:17px;width:100%}
  #view{padding:12px 10px 30px}
  .grid2,.proj-wrap{grid-template-columns:1fr}
  .semana{grid-template-columns:1fr}
  .wk{min-width:760px}
  .row .time{width:74px;font-size:12px}
  #modalBg{padding:10px}
}
table.cfg td{padding:6px 4px;border-bottom:1px solid #f0f1f4;vertical-align:middle}
</style>
</head>
<body>
<aside id="side">
  <h1>✔ Meus Afazeres</h1>
  <nav id="nav">
    <button data-v="hoje"><span class="ico">☀</span>Hoje</button>
    <button data-v="semana"><span class="ico">▤</span>Semana</button>
    <button data-v="calendario"><span class="ico">▦</span>Calendário</button>
    <button data-v="projetos"><span class="ico">◧</span>Empresas e projetos</button>
    <button data-v="config"><span class="ico">⚙</span>Configurações</button>
  </nav>
  <div class="grow"></div>
  <div id="outlookStatus"></div>
</aside>
<div id="main">
  <div id="top">
    <h2 id="titulo">Hoje</h2>
    <div id="filtros"></div>
    <button class="btn" id="btnReuniao">+ Reunião</button>
    <button class="btn pri" id="btnNovo">+ Novo</button>
  </div>
  <div id="view"></div>
</div>
<div id="modalBg"><div id="modal"></div></div>
<div id="toast"></div>

<script src="msal-browser.min.js"></script>
<script>
"use strict";
/* ================= utilidades ================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; };
const diffDays = (a, b) => Math.round((b - a) / 864e5);
const hoje0 = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const segunda = d => addDays(d, -((d.getDay() + 6) % 7));
const domingo = d => addDays(d, -d.getDay());
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DIAS = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
const DIAS_L = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const POS = { 1: 'primeira', 2: 'segunda', 3: 'terceira', 4: 'quarta', '-1': 'última' };
const TIPOS = { tarefa: 'Tarefa', entrega: 'Entrega', rotina: 'Rotina', reuniao: 'Reunião' };
const fmtData = s => { const d = parseYmd(s); return `${DIAS[d.getDay()]}, ${d.getDate()} ${MESES[d.getMonth()].slice(0, 3)}`; };
const hm2min = h => { const [a, b] = h.split(':').map(Number); return a * 60 + b; };
const min2hm = m => `${pad(Math.floor(m / 60) % 24)}:${pad(m % 60)}`;
function toast(msg, err) {
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg;
  $('#toast').appendChild(t); setTimeout(() => t.remove(), err ? 8000 : 3500);
}

/* ================= dados ================= */
let D = null;
const CORES = ['#2563eb', '#16a34a', '#9333ea', '#ea580c', '#0891b2', '#db2777', '#ca8a04', '#475569'];
function semente() {
  const a = { rn: uid(), jf: uid(), mg: uid(), ps: uid() };
  const obra = uid();
  const hojeS = ymd(hoje0());
  return {
    versao: 1,
    config: {
      fuso: 'E. South America Standard Time',
      calendarioPadrao: '', calendariosVisiveis: null, lembretePadrao: 15, notificacoes: true
    },
    areas: [
      { id: a.rn, nome: 'R. Nunes', cor: '#2563eb', calendarioId: '' },
      { id: a.jf, nome: 'JF', cor: '#16a34a', calendarioId: '' },
      { id: a.mg, nome: 'Magi', cor: '#9333ea', calendarioId: '' },
      { id: a.ps, nome: 'Pessoal', cor: '#ea580c', calendarioId: '' }
    ],
    projetos: [{ id: obra, areaId: a.rn, nome: 'Obra exemplo (apague ou renomeie)', tipo: 'obra', descricao: '' }],
    itens: [
      novoItemBase({ areaId: a.rn, projetoId: obra, tipo: 'rotina', titulo: 'Relatório semanal da obra', data: hojeS, hora: '16:00', duracao: 60, recorrencia: { freq: 'semanal', intervalo: 1, dias: [5] } }),
      novoItemBase({ areaId: a.rn, projetoId: obra, tipo: 'rotina', titulo: 'Medição mensal', data: hojeS, hora: '', recorrencia: { freq: 'mensal', intervalo: 1, modoMensal: 'dia', diaMes: 25 } }),
      novoItemBase({ areaId: a.ps, tipo: 'rotina', titulo: 'Academia', data: hojeS, hora: '06:30', duracao: 60, recorrencia: { freq: 'semanal', intervalo: 1, dias: [1, 3, 5] } }),
      novoItemBase({ areaId: a.ps, tipo: 'rotina', titulo: 'Almoço', data: hojeS, hora: '12:00', duracao: 60, recorrencia: { freq: 'semanal', intervalo: 1, dias: [1, 2, 3, 4, 5] } })
    ]
  };
}
function novoItemBase(o) {
  return Object.assign({
    id: uid(), areaId: '', projetoId: '', tipo: 'tarefa', titulo: '', data: '', hora: '', duracao: 60,
    recorrencia: null, lembrete: 15, notas: '', participantes: '', teams: false, local: '',
    sincronizar: false, calendarioId: '', outlook: null, erroSync: '', concluidas: {}, criado: new Date().toISOString()
  }, o);
}
const area = id => D.areas.find(a => a.id === id);
const projeto = id => D.projetos.find(p => p.id === id);
const corItem = it => (area(it.areaId) || {}).cor || '#64748b';

const APP = { clientId: '10f56873-dde9-4d8c-9b53-65e4cb2326ab', tenantId: '3c50769a-f2c3-45de-a848-dac895975f88' };
const GRAPH = 'https://graph.microsoft.com/v1.0';
const PASTA = '/me/drive/root:/Apps/MeusAfazeres';
let carregado = false, alterado = false;
function normalizar() {
  D.config = Object.assign({ fuso: 'E. South America Standard Time', calendarioPadrao: '', calendariosVisiveis: null, lembretePadrao: 15, notificacoes: true }, D.config || {});
  D.areas = D.areas || []; D.projetos = D.projetos || []; D.itens = (D.itens || []).map(i => Object.assign(novoItemBase({}), i));
}
async function carregar() {
  const t = await token();
  const r = await fetch(`${GRAPH}${PASTA}/dados.json:/content`, { headers: { Authorization: 'Bearer ' + t }, cache: 'no-store' });
  if (r.status === 404) { D = semente(); carregado = true; await gravar(); return; }
  if (!r.ok) { const j = await r.json().catch(() => null); throw new Error((j && j.error && j.error.message) || ('erro ' + r.status)); }
  D = await r.json(); normalizar(); carregado = true;
}
let tSalvar = null;
function salvar() { alterado = true; clearTimeout(tSalvar); tSalvar = setTimeout(gravar, 600); }
async function putArquivo(caminho, txt) {
  const t = await token();
  const r = await fetch(`${GRAPH}${PASTA}/${caminho}:/content`, { method: 'PUT', headers: { Authorization: 'Bearer ' + t, 'Content-Type': 'application/json' }, body: txt });
  if (!r.ok) { const j = await r.json().catch(() => null); throw new Error((j && j.error && j.error.message) || ('erro ' + r.status)); }
}
async function gravar() {
  clearTimeout(tSalvar);
  if (!carregado || !conectado()) return;
  try {
    const hojeS = ymd(new Date()), backup = D.config.ultimoBackup !== hojeS;
    if (backup) D.config.ultimoBackup = hojeS;
    const txt = JSON.stringify(D);
    await putArquivo('dados.json', txt);
    alterado = false;
    if (backup) putArquivo(`backups/dados-${hojeS}.json`, txt).catch(() => { });
  } catch (e) { toast('Não consegui salvar no OneDrive: ' + e.message, true); }
}
async function recarregarSeMudou() {
  if (!carregado || alterado || $('#modalBg').classList.contains('on')) return;
  try { await carregar(); faixaEventos = ''; render(); } catch (e) { console.error(e); }
}

/* ================= recorrência ================= */
function casa(r, start, d) {
  const iv = Math.max(1, +r.intervalo || 1);
  if (r.freq === 'diaria') return diffDays(start, d) % iv === 0;
  if (r.freq === 'semanal') {
    const dias = r.dias && r.dias.length ? r.dias : [start.getDay()];
    if (!dias.includes(d.getDay())) return false;
    return Math.round(diffDays(domingo(start), domingo(d)) / 7) % iv === 0;
  }
  if (r.freq === 'mensal') {
    const m = (d.getFullYear() - start.getFullYear()) * 12 + d.getMonth() - start.getMonth();
    if (m < 0 || m % iv) return false;
    if (r.modoMensal === 'posicao') {
      if (d.getDay() !== +r.diaSemana) return false;
      if (+r.posicao === -1) return addDays(d, 7).getMonth() !== d.getMonth();
      return Math.floor((d.getDate() - 1) / 7) + 1 === +r.posicao;
    }
    const ult = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    return d.getDate() === Math.min(+r.diaMes || start.getDate(), ult);
  }
  return false;
}
function ocorrencias(it, ini, fim) {
  if (!it.data) return [];
  const start = parseYmd(it.data), r = it.recorrencia;
  if (!r) return (start >= ini && start <= fim) ? [it.data] : [];
  let fimEf = fim;
  if (r.ate) { const a = parseYmd(r.ate); if (a < fimEf) fimEf = a; }
  const out = [];
  for (let d = start > ini ? start : new Date(ini); d <= fimEf; d = addDays(d, 1)) if (casa(r, start, d)) out.push(ymd(d));
  return out;
}
function primeiraOcorrencia(it) {
  if (!it.data) return '';
  if (!it.recorrencia) return it.data;
  const s = parseYmd(it.data);
  return ocorrencias(it, s, addDays(s, 800))[0] || it.data;
}
function proximaOcorrencia(it) {
  const h = hoje0();
  return ocorrencias(it, h, addDays(h, 400)).find(d => !it.concluidas[d]) || '';
}
function descRec(r) {
  if (!r) return '';
  const iv = +r.intervalo || 1;
  let s;
  if (r.freq === 'diaria') s = iv === 1 ? 'Todo dia' : `A cada ${iv} dias`;
  else if (r.freq === 'semanal') s = (iv === 1 ? 'Toda semana' : `A cada ${iv} semanas`) + ': ' + (r.dias || []).slice().sort().map(i => DIAS[i]).join(', ');
  else if (r.modoMensal === 'posicao') s = (iv === 1 ? 'Todo mês' : `A cada ${iv} meses`) + ` na ${POS[r.posicao]} ${DIAS_L[r.diaSemana].replace('-feira', '')}`;
  else s = (iv === 1 ? 'Todo mês' : `A cada ${iv} meses`) + ` no dia ${r.diaMes}`;
  if (r.ate) s += ` (até ${fmtData(r.ate)})`;
  return s;
}

/* ================= Outlook (Microsoft Graph) ================= */
const SCOPES = ['User.Read', 'Calendars.ReadWrite', 'Calendars.ReadWrite.Shared', 'Files.ReadWrite'];
const REDIRECT = location.origin + location.pathname.replace(/index\.html$/, '');

  const add = (lst, grupo) => lst.forEach(c => { if (!mapa.has(c.id)) mapa.set(c.id, { id: c.id, nome: c.name, cor: c.hexColor || '', podeEditar: c.canEdit, dono: (c.owner && (c.owner.name || c.owner.address)) || '', padrao: c.isDefaultCalendar, grupo }); });
  add((await graph('GET', '/me/calendars?' + sel)).value, '');

    const gs = (await graph('GET', '/me/calendarGroups?$select=id,name')).value;
    for (const g of gs) add((await graph('GET', `/me/calendarGroups/${encodeURIComponent(g.id)}/calendars?${sel}`)).value, g.name);
  } catch (e) { console.warn('grupos de calendário', e); }

  const conhecidos = new Set(D.config.calendariosConhecidos || D.config.calendariosVisiveis || []);
  const vis = new Set(D.config.calendariosVisiveis || []);

  calendarios.forEach(c => { if (!conhecidos.has(c.id)) { vis.add(c.id); mudou = true; } });

function entradas(ini, fim) {

    if (filtroOff.has(it.areaId)) return;
    ocorrencias(it, ini, fim).forEach(d => {
      const st = it.hora ? hm2min(it.hora) : null;
      out.push({ k: 'item', it, data: d, hora: it.hora, fim: st != null ? min2hm(Math.min(st + (+it.duracao || 30), 1439)) : '', titulo: it.titulo, cor: corItem(it), feito: !!it.concluidas[d] });
    });

  eventos.forEach(e => {
    if (meus.has(e.id) || (e.seriesMasterId && meus.has(e.seriesMasterId))) return;
    const ar = D.areas.find(a => a.calendarioId && a.calendarioId === e._cal.id);
    if (ar ? filtroOff.has(ar.id) : filtroOff.has('outlook')) return;
    const sd = e.start.dateTime.slice(0, 10), st = e.start.dateTime.slice(11, 16), en = e.end.dateTime.slice(11, 16);

      const dd = addDays(ini, i), d = ymd(dd), l = ent.filter(x => x.data === d);
      g += `<div class="cel ${dd.getMonth() !== m0.getMonth() ? 'fora' : ''} ${d === hs ? 'hoje' : ''}" data-dia="${d}"><span class="n">${dd.getDate()}</span>
        ${l.slice(0, 4).map(x => `<div class="adchip" style="background:${x.cor};${x.feito ? 'opacity:.45' : ''}" ${x.k === 'item' ? `data-item="${x.it.id}"` : `data-ev="${esc(x.e.id)}"`}>${x.hora ? x.hora + ' ' : ''}${esc(x.titulo)}</div>`).join('')}
        ${l.length > 4 ? `<div class="mais">+${l.length - 4} mais</div>` : ''}</div>`;
    }
    return head.replace('<span class="lbl" id="calLbl"></span>', `<span class="lbl" style="text-transform:capitalize">${MESES[m0.getMonth()]} ${m0.getFullYear()}</span>`) + g + '</div>';
  }
  const ini = segunda(refCal), fim = addDays(ini, 6);
  carregarEventos(ini, fim);
  const ent = entradas(ini, fim);
  let g = `<div class="wk"><div class="hd"></div>`;
  for (let i = 0; i < 7; i++) { const dd = addDays(ini, i); g += `<div class="hd ${ymd(dd) === hs ? 'hoje' : ''}">${DIAS[dd.getDay()]} ${dd.getDate()}</div>`; }
  g += `<div class="ad" style="border-left:0;font-size:10px;color:var(--muted);padding-top:6px;text-align:right">dia todo</div>`;
  for (let i = 0; i < 7; i++) {
    const d = ymd(addDays(ini, i));
    g += `<div class="ad">${ent.filter(x => x.data === d && !x.hora).map(x => `<div class="adchip" style="background:${x.cor};${x.feito ? 'opacity:.45' : ''}" ${x.k === 'item' ? `data-item="${x.it.id}"` : `data-ev="${esc(x.e.id)}"`}>${esc(x.titulo)}</div>`).join('')}</div>`;
  }
  g += `<div class="hrs">${Array.from({ length: H1 - H0 }, (_, i) => `<div class="hr">${pad(H0 + i)}:00</div>`).join('')}</div>`;
  for (let i = 0; i < 7; i++) {
    const d = ymd(addDays(ini, i));
    const evs = layout(ent.filter(x => x.data === d && x.hora));
    g += `<div class="col ${d === hs ? 'hoje' : ''}" data-coldia="${d}" style="height:${(H1 - H0) * PX}px">${evs.map(x => {
      const s = Math.max(hm2min(x.hora), H0 * 60), e = Math.max(Math.min(hm2min(x.fim || x.hora) || s + 30, H1 * 60), s + 20);
      const top = (s - H0 * 60) / 60 * PX, h = (e - s) / 60 * PX - 2;
      return `<div class="ev ${x.feito ? 'done' : ''}" style="top:${top}px;height:${h}px;left:calc(${x._c / x._n * 100}% + 1px);width:calc(${100 / x._n}% - 3px);background:${x.cor}" ${x.k === 'item' ? `data-item="${x.it.id}"` : `data-ev="${esc(x.e.id)}"`}><b>${x.hora}</b> ${esc(x.titulo)}</div>`;
    }).join('')}${d === hs ? `<div class="nowline" id="nowline"></div>` : ''}</div>`;
  }
  return head.replace('<span class="lbl" id="calLbl"></span>', `<span class="lbl">${ini.getDate()} ${MESES[ini.getMonth()].slice(0, 3)} – ${fim.getDate()} ${MESES[fim.getMonth()].slice(0, 3)} ${fim.getFullYear()}</span>`) + g + '</div>';
}
function layout(lst) {
  // distribui eventos sobrepostos em colunas
  const ev = lst.map(x => Object.assign(x, { _s: hm2min(x.hora), _e: Math.max(hm2min(x.fim || x.hora), hm2min(x.hora) + 20) })).sort((a, b) => a._s - b._s);
  let grupo = [], fimG = -1;
  const fecha = () => { const n = Math.max(1, ...grupo.map(g => g._c + 1)); grupo.forEach(g => g._n = n); grupo = []; };
  ev.forEach(x => {
    if (x._s >= fimG && grupo.length) fecha();
    const usadas = grupo.filter(g => g._e > x._s).map(g => g._c);
    let c = 0; while (usadas.includes(c)) c++;
    x._c = c; grupo.push(x); fimG = Math.max(fimG, x._e);
  });
  if (grupo.length) fecha();
  return ev;
}
function posicionarCalendario() {
  const n = new Date(), nl = $('#nowline');
  if (nl) nl.style.top = ((n.getHours() * 60 + n.getMinutes() - H0 * 60) / 60 * PX) + 'px';
}

function nomeCal(id) { if (!id) return 'principal'; const k = calendarios.find(c => c.id === id); return k ? k.nome : 'outro'; }
async function salvarItemModal() {
  const id = modalItem._id, novo = modalItem._novo;
  const it = novo ? modalItem._rascunho : D.itens.find(i => i.id === id);
  const tit = $('#iTit').value.trim();
  if (!tit) { toast('Dê um título ao item.', true); return; }
  const rep = $('#iRep').value;
  let rec = null;
  if (rep !== 'nao') {
    if (!$('#iData').value) { toast('Informe a data de início da repetição.', true); return; }
    rec = { freq: rep, intervalo: Math.max(1, +$('#iInt').value || 1), ate: $('#iAte').value || '' };
    if (rep === 'semanal') { rec.dias = $$('.iDow:checked').map(x => +x.value); if (!rec.dias.length) rec.dias = [parseYmd($('#iData').value).getDay()]; }
    if (rep === 'mensal') {
      rec.modoMensal = $('#iModo').value;
      if (rec.modoMensal === 'posicao') { rec.posicao = +$('#iPos').value; rec.diaSemana = +$('#iDsem').value; }
      else rec.diaMes = Math.min(31, Math.max(1, +$('#iDiaMes').value || parseYmd($('#iData').value).getDate()));
    }
  }
  Object.assign(it, {
    titulo: tit, tipo: $('#iTipo').value, areaId: $('#iArea').value, projetoId: $('#iProj').value,
    data: $('#iData').value, hora: $('#iHora').value, duracao: Math.max(5, +$('#iDur').value || 60), recorrencia: rec,
    participantes: $('#iPart').value.trim(), local: $('#iLocal').value.trim(), teams: $('#iTeams').checked,
    sincronizar: $('#iSync').checked, calendarioId: $('#iCal').value, lembrete: Math.max(0, +$('#iLemb').value || 0), notas: $('#iNotas').value
  });
  if (it.sincronizar && !it.data) { toast('Para gravar no Outlook o item precisa de uma data.', true); return; }
  if (novo) D.itens.push(it);
  fecharModal(); salvar(); render();
  if (it.sincronizar || it.outlook) { await sincronizar(it); salvar(); faixaEventos = ''; render(); if (!it.erroSync && conectado()) toast('Agenda do Outlook atualizada.'); }
}
async function excluirItem() {
  const it = D.itens.find(i => i.id === modalItem._id);
  if (!it) return fecharModal();
  if (!confirmar.ok) { confirmar.ok = true; const b = $('[data-acao=excluirItem]'); b.textContent = it.outlook ? 'Confirmar (apaga também do Outlook)' : 'Confirmar exclusão'; return; }
  confirmar.ok = false;
  if (it.outlook && conectado()) { it.sincronizar = false; await sincronizar(it); }
  D.itens = D.itens.filter(i => i !== it);
  fecharModal(); salvar(); faixaEventos = ''; render();
}
const confirmar = { ok: false };

function modalEvento(e) {
  const c = e._cal, edit = c.podeEditar;
  const sd = e.start.dateTime.slice(0, 10), st = e.start.dateTime.slice(11, 16), en = e.end.dateTime.slice(11, 16);
  const join = e.onlineMeeting && e.onlineMeeting.joinUrl;
  abrirModal(`<h3>${esc(e.subject || '(sem título)')}</h3>
    <p class="hint">Evento do Outlook · calendário <b>${esc(c.nome)}</b>${e.organizer ? ' · organizador: ' + esc(e.organizer.emailAddress.name) : ''}${e.seriesMasterId ? ' · faz parte de uma série' : ''}</p>
    ${edit ? `<div class="f"><label>Título</label><input id="eTit" value="${esc(e.subject)}"></div>
    <div class="fr"><div class="f"><label>Data</label><input type="date" id="eData" value="${sd}"></div>${e.isAllDay ? '' : `<div class="f"><label>Início</label><input type="time" id="eIni" value="${st}"></div><div class="f"><label>Fim</label><input type="time" id="eFim" value="${en}"></div>`}</div>
    <div class="f"><label>Local</label><input id="eLocal" value="${esc(e.location && e.location.displayName)}"></div>
    ${e.seriesMasterId ? '<p class="hint">As alterações valem só para esta ocorrência.</p>' : ''}`
      : `<p>${fmtData(sd)} ${e.isAllDay ? '(dia todo)' : st + '–' + en}</p>${e.location && e.location.displayName ? `<p>Local: ${esc(e.location.displayName)}</p>` : ''}<p class="hint">Este calendário é só para leitura.</p>`}
    <p>${join ? `<a href="${esc(join)}" target="_blank">Entrar na reunião do Teams</a> · ` : ''}${e.webLink ? `<a href="${esc(e.webLink)}" target="_blank">Abrir no Outlook</a>` : ''}</p>
    <div class="acts">${edit ? `<button class="btn dan l" data-acao="excluirEv">Excluir</button>` : ''}<button class="btn" data-acao="fechar">Fechar</button>${edit ? `<button class="btn pri" data-acao="salvarEv">Salvar</button>` : ''}</div>`);
  modalEvento._e = e;
}
async function salvarEvento() {
  const e = modalEvento._e, d = $('#eData').value;
  const body = { subject: $('#eTit').value, location: { displayName: $('#eLocal').value } };
  if (!e.isAllDay) {
    body.start = { dateTime: `${d}T${$('#eIni').value}:00`, timeZone: D.config.fuso };
    body.end = { dateTime: `${d}T${$('#eFim').value}:00`, timeZone: D.config.fuso };
  } else {
    body.start = { dateTime: `${d}T00:00:00`, timeZone: D.config.fuso };
    body.end = { dateTime: `${ymd(addDays(parseYmd(d), 1))}T00:00:00`, timeZone: D.config.fuso };
  }
  try { await graph('PATCH', `${calPath(e._cal.id)}/events/${e.id}`, body); toast('Evento atualizado no Outlook.'); fecharModal(); faixaEventos = ''; render(); }
  catch (er) { toast('Outlook: ' + er.message, true); }
}
async function excluirEvento() {
  const e = modalEvento._e;
  if (!confirmar.ok) { confirmar.ok = true; $('[data-acao=excluirEv]').textContent = 'Confirmar exclusão no Outlook'; return; }
  confirmar.ok = false;
  try { await graph('DELETE', `${calPath(e._cal.id)}/events/${e.id}`); toast('Evento excluído.'); fecharModal(); faixaEventos = ''; render(); }
  catch (er) { toast('Outlook: ' + er.message, true); }
}

function modalArea(a) {
  const novo = !a; a = a || { id: uid(), nome: '', cor: CORES[D.areas.length % CORES.length], calendarioId: '' };
  abrirModal(`<h3>${novo ? 'Nova empresa / área' : 'Editar empresa / área'}</h3>
    <div class="fr"><div class="f" style="flex:3"><label>Nome</label><input id="aNome" value="${esc(a.nome)}"></div><div class="f"><label>Cor</label><input type="color" id="aCor" value="${a.cor}" style="height:36px;padding:2px"></div></div>
    <div class="acts">${novo ? '' : `<button class="btn dan l" data-acao="excluirArea">Excluir</button>`}<button class="btn" data-acao="fechar">Cancelar</button><button class="btn pri" data-acao="salvarArea">Salvar</button></div>`);
  modalArea._a = a; modalArea._novo = novo;
}
function modalProj(p) {
  const novo = !p;
  p = p || { id: uid(), areaId: selProj && selProj.tipo === 'area' ? selProj.id : (D.areas[0] || {}).id, nome: '', tipo: 'obra', descricao: '' };
  abrirModal(`<h3>${novo ? 'Novo projeto / obra' : 'Editar projeto / obra'}</h3>
    <div class="f"><label>Nome</label><input id="pNome" value="${esc(p.nome)}" placeholder="Ex.: Obra Residencial Jardins"></div>
    <div class="fr"><div class="f"><label>Empresa / área</label><select id="pArea">${D.areas.map(a => `<option value="${a.id}" ${a.id === p.areaId ? 'selected' : ''}>${esc(a.nome)}</option>`).join('')}</select></div>
      <div class="f"><label>Tipo</label><select id="pTipo"><option value="obra" ${p.tipo === 'obra' ? 'selected' : ''}>Obra</option><option value="projeto" ${p.tipo === 'projeto' ? 'selected' : ''}>Projeto</option></select></div></div>
    <div class="f"><label>Descrição / observações</label><textarea id="pDesc">${esc(p.descricao)}</textarea></div>
    <div class="acts">${novo ? '' : `<button class="btn dan l" data-acao="excluirProj">Excluir</button>`}<button class="btn" data-acao="fechar">Cancelar</button><button class="btn pri" data-acao="salvarProj">Salvar</button></div>`);
  modalProj._p = p; modalProj._novo = novo;
}

function novoItem(o = {}) {
  const aid = o.areaId || (selProj && selProj.tipo === 'area' ? selProj.id : selProj && selProj.tipo === 'proj' ? (projeto(selProj.id) || {}).areaId : '') || (D.areas[0] || {}).id;
  const it = novoItemBase(Object.assign({ areaId: aid, data: ymd(hoje0()), lembrete: D.config.lembretePadrao }, o));
  if (it.tipo === 'rotina' && !it.recorrencia) it.recorrencia = { freq: 'semanal', intervalo: 1, dias: [parseYmd(it.data).getDay()] };
  if (it.tipo === 'reuniao') { it.sincronizar = true; if (!it.hora) it.hora = '09:00'; }
  modalItem(it, true);
}

/* ================= eventos da interface ================= */
document.addEventListener('click', async ev => {
  const t = ev.target;
  if (t.matches('#modalBg')) return fecharModal();
  const nav = t.closest('#nav button'); if (nav) return irPara(nav.dataset.v);
  const conc = t.closest('[data-conc]');
  if (conc) {
    const [id, d] = conc.dataset.conc.split('|'), it = D.itens.find(i => i.id === id);
    if (it) { if (conc.checked) it.concluidas[d] = true; else delete it.concluidas[d]; salvar(); setTimeout(render, 150); }
    return;
  }
  const fi = t.closest('[data-filtro]');
  if (fi) { const k = fi.dataset.filtro; filtroOff.has(k) ? filtroOff.delete(k) : filtroOff.add(k); return render(); }
  const iEl = t.closest('[data-item]');
  if (iEl) { ev.stopPropagation(); const it = D.itens.find(i => i.id === iEl.dataset.item); if (it) modalItem(it, false); return; }
  const eEl = t.closest('[data-ev]');
  if (eEl) { ev.stopPropagation(); const e = eventos.find(x => x.id === eEl.dataset.ev); if (e) modalEvento(e); return; }
  const nd = t.closest('[data-novo-data]'); if (nd) return novoItem({ data: nd.dataset.novoData });
  const nt = t.closest('[data-novo-tipo]'); if (nt) return novoItem(Object.assign({ tipo: nt.dataset.novoTipo }, JSON.parse(nt.dataset.ctx)));
  const cel = t.closest('[data-dia]'); if (cel) { refCal = parseYmd(cel.dataset.dia); modoCal = 'semana'; return render(); }
  const col = t.closest('[data-coldia]');
  if (col) { const y = ev.clientY - col.getBoundingClientRect().top; const m = Math.floor((y / PX * 60 + H0 * 60) / 30) * 30; return novoItem({ data: col.dataset.coldia, hora: min2hm(m) }); }
  const sa = t.closest('[data-selarea]'); if (sa) { selProj = { tipo: 'area', id: sa.dataset.selarea }; return render(); }
  const sp = t.closest('[data-selproj]'); if (sp) { selProj = { tipo: 'proj', id: sp.dataset.selproj }; vista = 'projetos'; return render(); }
  const ea = t.closest('[data-editarea]'); if (ea) return modalArea(area(ea.dataset.editarea));
  const ep = t.closest('[data-editproj]'); if (ep) return modalProj(projeto(ep.dataset.editproj));
  const ac = t.closest('[data-acao]'); if (!ac) return;
  const a = ac.dataset.acao;
  if (a !== 'excluirItem' && a !== 'excluirEv' && a !== 'excluirArea' && a !== 'excluirProj') confirmar.ok = false;
  switch (a) {
    case 'fechar': return fecharModal();
    case 'entrar': return entrar();
    case 'sair': return sair();
    case 'salvarItem': return salvarItemModal();
    case 'excluirItem': return excluirItem();
    case 'salvarEv': return salvarEvento();
    case 'excluirEv': return excluirEvento();
    case 'semAnt': refSemana = addDays(refSemana, -7); return render();
    case 'semProx': refSemana = addDays(refSemana, 7); return render();
    case 'semHoje': refSemana = segunda(hoje0()); return render();
    case 'calAnt': refCal = modoCal === 'mes' ? new Date(refCal.getFullYear(), refCal.getMonth() - 1, 1) : addDays(refCal, -7); return render();
    case 'calProx': refCal = modoCal === 'mes' ? new Date(refCal.getFullYear(), refCal.getMonth() + 1, 1) : addDays(refCal, 7); return render();
    case 'calHoje': refCal = hoje0(); return render();
    case 'modoSemana': modoCal = 'semana'; return render();
    case 'modoMes': modoCal = 'mes'; return render();
    case 'recarregar': faixaEventos = ''; calendarios = []; calsPromessa = null; erroOutlook = ''; return render();
    case 'novaArea': return modalArea(null);
    case 'novoProj': return modalProj(null);
    case 'salvarArea': {
      const ar = modalArea._a; ar.nome = $('#aNome').value.trim(); ar.cor = $('#aCor').value;
      if (!ar.nome) return toast('Dê um nome.', true);
      if (modalArea._novo) D.areas.push(ar);
      fecharModal(); salvar(); return render();
    }
    case 'excluirArea': {
      const ar = modalArea._a;
      if (D.projetos.some(p => p.areaId === ar.id) || D.itens.some(i => i.areaId === ar.id)) return toast('Mova ou exclua os projetos e itens desta área antes.', true);
      if (!confirmar.ok) { confirmar.ok = true; ac.textContent = 'Confirmar exclusão'; return; }
      confirmar.ok = false; D.areas = D.areas.filter(x => x !== ar); selProj = null; fecharModal(); salvar(); return render();
    }
    case 'salvarProj': {
      const p = modalProj._p; p.nome = $('#pNome').value.trim(); p.areaId = $('#pArea').value; p.tipo = $('#pTipo').value; p.descricao = $('#pDesc').value;
      if (!p.nome) return toast('Dê um nome ao projeto.', true);
      if (modalProj._novo) D.projetos.push(p);
      D.itens.filter(i => i.projetoId === p.id).forEach(i => i.areaId = p.areaId);
      selProj = { tipo: 'proj', id: p.id }; fecharModal(); salvar(); return render();
    }
    case 'excluirProj': {
      const p = modalProj._p, n = D.itens.filter(i => i.projetoId === p.id).length;
      if (!confirmar.ok) { confirmar.ok = true; ac.textContent = n ? `Confirmar (os ${n} itens ficam sem projeto)` : 'Confirmar exclusão'; return; }
      confirmar.ok = false;
      D.itens.forEach(i => { if (i.projetoId === p.id) i.projetoId = ''; });
      D.projetos = D.projetos.filter(x => x !== p); selProj = { tipo: 'area', id: p.areaId }; fecharModal(); salvar(); return render();
    }
        case 'sincPend': await sincronizarPendentes(); faixaEventos = ''; return render();
    case 'testarNotif': return notificar('Teste', 'As notificações estão funcionando.');
  }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.matches('[data-calvis]')) {
    const s = new Set(D.config.calendariosVisiveis || []); t.checked ? s.add(t.dataset.calvis) : s.delete(t.dataset.calvis);
    D.config.calendariosVisiveis = [...s]; faixaEventos = ''; salvar(); return;
  }
  if (t.matches('[data-areacal]')) { area(t.dataset.areacal).calendarioId = t.value; salvar(); return; }
  if (t.id === 'cfgCalPad') { D.config.calendarioPadrao = t.value; salvar(); }
  if (t.id === 'cfgLemb') { D.config.lembretePadrao = Math.max(0, +t.value || 0); salvar(); }
  if (t.id === 'cfgNotif') { D.config.notificacoes = t.checked; salvar(); if (t.checked) pedirNotif(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharModal(); });
$('#btnNovo').onclick = () => novoItem();
$('#btnReuniao').onclick = () => novoItem({ tipo: 'reuniao' });

/* ================= lembretes ================= */
function pedirNotif() { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); }
function notificar(tit, txt) {
  toast(`${tit}: ${txt}`);
  if ('Notification' in window && Notification.permission === 'granted') { try { new Notification(tit, { body: txt }); } catch { } }
  else pedirNotif();
}
const avisados = new Set();
function verificarLembretes() {
  if (!D.config.notificacoes) return;
  const n = new Date(), hs = ymd(n), agora = n.getHours() * 60 + n.getMinutes();
  D.itens.forEach(it => {
    if (!it.hora || (it.sincronizar && it.outlook)) return;
    if (!ocorrencias(it, hoje0(), hoje0()).length || it.concluidas[hs]) return;
    const ini = hm2min(it.hora), k = it.id + hs;
    if (agora >= ini - (+it.lembrete || 0) && agora <= ini && !avisados.has(k)) {
      avisados.add(k);
      const p = projeto(it.projetoId);
      notificar(`${it.hora} · ${it.titulo}`, [area(it.areaId) && area(it.areaId).nome, p && p.nome].filter(Boolean).join(' · ') || 'Lembrete');
    }
  });
}

/* ================= início ================= */
function telaLogin(msg) {
  document.body.classList.add('login');
  $('#titulo').textContent = 'Meus Afazeres'; $('#filtros').innerHTML = ''; $('#outlookStatus').innerHTML = '';
  $('#view').innerHTML = `<div class="card" style="max-width:520px;margin:40px auto;text-align:center;padding:32px">
    <div style="font-size:40px">✔</div><h2 style="margin:8px 0">Meus Afazeres</h2>
    <p class="hint">Entre com sua conta Microsoft para ver suas tarefas e sua agenda do Outlook.<br>Seus dados ficam salvos no seu OneDrive.</p>
    ${msg ? `<p class="tag err" style="display:block;padding:8px;margin:12px 0">${esc(msg)}</p>` : ''}
    <button class="btn pri" style="margin-top:10px;padding:10px 22px" data-acao="entrar">Entrar com a Microsoft</button></div>`;
}
(async function () {
  await iniciarMsal();
  if (!conectado()) return telaLogin(erroOutlook);
  try { await carregar(); }
  catch (e) { return telaLogin('Não consegui ler seus dados no OneDrive: ' + e.message); }
  document.body.classList.remove('login');
  render();
  carregarCalendarios().then(() => { sincronizarPendentes(); render(); }).catch(e => { erroOutlook = e.message; render(); });
  pedirNotif();
  setInterval(verificarLembretes, 30000); verificarLembretes();
  setInterval(() => { if (vista === 'calendario') posicionarCalendario(); }, 60000);
  setInterval(() => { faixaEventos = ''; if (['hoje', 'semana', 'calendario'].includes(vista) && !$('#modalBg').classList.contains('on')) render(); }, 5 * 60000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') recarregarSeMudou(); });
  window.addEventListener('beforeunload', e => { if (alterado) { gravar(); e.preventDefault(); } });
})();
</script>
