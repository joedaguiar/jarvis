<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meus Afazeres</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Estilo "maquete": painel de linho sobre fundo marinho, sálvia para estrutura, coral só para hoje e ações principais */
:root{
  --marinho:#1f3b52; --linho:#ebe7df; --papel:#f8f6f1; --areia:#ddd6c9; --linha:#e6e1d7;
  --salvia:#5b8a86; --salvia-esc:#2f5f63; --nevoa:#a9c3bf; --coral:#e8693f; --coral-soft:#fbe7de;
  --ink:#23313d; --muted:#6d7a82; --danger:#c0392b; --ok:#3f7f6b; --warn:#b4541f;
  --sombra:0 1px 0 rgba(255,255,255,.9) inset,0 10px 26px rgba(31,59,82,.08);
  --accent:var(--salvia-esc); --accent-soft:#e3eeec; --hoje:var(--coral); --hoje-soft:var(--coral-soft); --line:var(--linha); --line-2:#efebe3; --card:var(--papel);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.5 Manrope,"Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--linho);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--salvia-esc)}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#app{display:flex;height:100vh;background:var(--linho)}

/* menu lateral */
#side{width:212px;flex:none;background:var(--marinho);color:#c8d6e2;display:flex;flex-direction:column;padding:16px 10px}
#side h1{font-weight:800;font-size:16px;color:#fff;margin:2px 10px 18px;letter-spacing:.1px}
#side nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-radius:12px;margin-bottom:3px;color:#b9c9d6;font-weight:600}
#side nav button:hover{background:rgba(255,255,255,.08);color:#fff}
#side nav button.on{background:rgba(255,255,255,.14);color:#fff}
#side nav button.on .ico{color:var(--coral)}
#side .ico{width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;flex:none}
#side h1{display:flex;align-items:center;gap:8px}
#side .logo{display:inline-flex;color:var(--coral)}
#btnMini{display:flex;justify-content:center}
#side .grow{flex:1}
#btnMini{background:none;border:0;color:#9fb3c3;font-size:16px;padding:8px;margin-top:6px;border-radius:10px}
#btnMini:hover{background:rgba(255,255,255,.08);color:#fff}
body.mini #side{width:62px;padding:14px 8px}
body.mini #side .tx{display:none}
body.mini #side h1{margin:2px 0 16px;justify-content:center}
body.mini #side nav button{justify-content:center;padding:11px 0}

body.mini #outlookStatus{padding:8px 0;text-align:center;background:none;box-shadow:none}
body.mini #outlookStatus .det{display:none}
body.mini #outlookStatus .dot{margin:3px}
#outlookStatus{font-size:12px;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.18);line-height:1.4;color:#c8d6e2}
#outlookStatus .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}

/* área principal */
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#top{display:flex;align-items:center;gap:8px;padding:14px 22px 10px;flex-wrap:wrap}
#top h2{margin:0 auto 0 0;font-weight:800;font-size:22px;letter-spacing:-.2px}
#filtros{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--areia);background:var(--papel);border-radius:999px;padding:6px 13px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;font-weight:600;box-shadow:var(--sombra)}
.chip .sw{width:9px;height:9px}
.btn{border:1px solid var(--areia);background:var(--papel);border-radius:12px;padding:7px 14px;font-weight:600;box-shadow:0 1px 0 #fff inset}
.btn:hover{background:#fff}
.btn.ok{background:#fff;border-color:#16a34a;color:#15803d}.btn.ok:hover{background:#16a34a;color:#fff}
.btn.pri{background:var(--coral);border-color:var(--coral);color:#fff;box-shadow:0 6px 14px rgba(232,105,63,.28)}
.btn.pri:hover{background:#d95a31}
.btn.dan{color:var(--danger)}
.btn.sm{padding:4px 11px;font-size:12.5px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:default}
#view{flex:1;overflow:auto;padding:6px 22px 30px}
.card{background:var(--papel);border:1px solid rgba(255,255,255,.7);border-radius:18px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--sombra)}
.card h3{margin:0 0 10px;font-weight:700;font-size:15.5px;color:var(--ink);letter-spacing:-.1px}
.empty{color:var(--muted);padding:4px 0}
.row{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:12px;border-bottom:1px solid var(--line-2)}
.row:last-child{border-bottom:0}
.row:hover{background:#fff}
.row .time{width:96px;flex:none;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.row .bar{width:4px;align-self:stretch;border-radius:3px;flex:none}
.row .txt{flex:1;min-width:0;cursor:pointer}
.row .t{font-weight:600}
.row .s{font-size:12.5px;color:var(--muted)}
.row.done .t{text-decoration:line-through;color:var(--muted)}
.chk{width:18px;height:18px;flex:none;accent-color:var(--salvia);cursor:pointer}
.tag{font-size:11px;border-radius:6px;padding:1px 7px;background:#ece7de;color:#5c6870;margin-left:6px;white-space:nowrap;font-weight:600}
.evo{font-weight:500;white-space:nowrap}
.evo i{display:inline-block;width:3px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.ev .evo i{display:none}
.ev .evm{font-size:10.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.ev .evt{font-weight:700}
.otag{display:inline;font-size:10px;font-weight:700;padding:0 7px 0 5px;border-radius:999px;margin:1px 5px 1px 1px;line-height:15px;vertical-align:1px;white-space:nowrap;letter-spacing:.1px}
.otag i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;vertical-align:1px}
.tag.ol{background:var(--accent-soft);color:var(--salvia-esc)}
.tag.err{background:#fbe3df;color:var(--danger)}
.tag.late{background:var(--coral-soft);color:var(--warn)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.sw{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none}
.hint{font-size:12.5px;color:var(--muted)}

/* painel */
.painel{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:14px;align-items:start}
.painel .ola{grid-column:1/-1;display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin:0;background:linear-gradient(120deg,var(--papel) 0,var(--papel) 55%,#e9f0ee 100%)}
.painel .ola h2{margin:0;font-weight:800;font-size:24px;letter-spacing:-.3px}
.painel .ola p{margin:2px 0 0}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}
.kpi{background:#fff;border-radius:14px;padding:8px 14px;min-width:96px;display:flex;flex-direction:column;box-shadow:0 1px 0 #fff inset,0 4px 12px rgba(31,59,82,.06)}
.kpi b{font-weight:800;font-size:22px;color:var(--salvia-esc);line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.alerta b{color:var(--coral)}
.kpi.anel{flex-direction:row;align-items:center;gap:8px}
.kpi.anel b{font-size:14px;color:var(--ink)}
.atalhos{display:flex;gap:8px}
.col-a,.col-b{min-width:0}
.kpi{border:0;font:inherit;text-align:left;cursor:pointer}.kpi.anel{cursor:default}
.kpi:hover{box-shadow:0 1px 0 #fff inset,0 8px 18px rgba(31,59,82,.1)}
.ag{display:flex;align-items:center;gap:10px;padding:7px 6px;border-radius:12px;border-bottom:1px solid var(--line-2)}
.ag:last-child{border-bottom:0}
.ag.passou{opacity:.45}
.ag.atual{background:var(--coral-soft)}
.ag-h{width:46px;flex:none;font-weight:700;font-variant-numeric:tabular-nums;font-size:13px;display:flex;flex-direction:column;line-height:1.15}
.ag-h small{font-weight:500;color:var(--muted);font-size:11px}
.ag>i{width:4px;align-self:stretch;border-radius:3px;flex:none}
.ag-t{flex:1;min-width:0;cursor:pointer;font-weight:600;font-size:13.5px}
.tag.agora{background:var(--coral);color:#fff}.tag.prox{background:#e6efed;color:var(--salvia-esc)}
.ag-dia{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.ag-dia .adchip{position:static;cursor:pointer}
.dg{margin-bottom:10px}.dg h4{display:flex;align-items:center;gap:8px;margin:6px 4px 4px;font-size:12.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.dg h4 span{background:var(--papel);border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:11px;color:var(--muted)}
.dg.alerta h4{color:var(--warn)}.dg.alerta h4 span{background:var(--coral);border-color:var(--coral);color:#fff}
.dg.hoje h4{color:var(--coral)}
.btn.ghost{background:none;border:0;color:var(--salvia-esc);margin:2px 0 0 6px}
.clima .cl-agora{display:flex;align-items:center;gap:12px;margin:2px 0 12px}
.clima .cl-ic{font-size:34px;line-height:1}.clima .cl-agora>b{font-size:30px;font-weight:800;letter-spacing:-1px}
.cl-dias{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cl-d{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;border-radius:12px;background:#fff;font-size:12px}
.cl-d.hoje{background:var(--coral-soft)}
.cl-d span{color:var(--muted);font-size:11px}.cl-d i{font-style:normal;font-size:18px;line-height:1.3}.cl-d b{font-weight:800}.cl-d small{color:var(--muted)}
.cl-d em{font-style:normal;font-size:10.5px;color:var(--muted)}.cl-d em.alta{color:#2563eb;font-weight:700}
.cl-alerta{margin-top:10px;font-size:12.5px;background:#eef4ff;color:#1e3a8a;border-radius:10px;padding:7px 10px}
.emp{display:flex;align-items:center;gap:10px;padding:5px 0}
.emp-n{width:80px;flex:none;font-weight:600;display:flex;align-items:center;gap:7px}.emp-n i{width:10px;height:10px;border-radius:50%}
.emp-b{flex:1;height:8px;border-radius:99px;background:var(--areia);overflow:hidden}.emp-b b{display:block;height:100%;border-radius:99px}
.emp-c{width:120px;flex:none;text-align:right;font-size:12.5px;font-variant-numeric:tabular-nums}.emp-c em{font-style:normal;color:var(--warn);font-weight:600}
.minical{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.minical .mh{font-size:11px;color:var(--muted);font-weight:700;padding-bottom:2px}
.minical .md{border:0;background:none;border-radius:10px;padding:5px 0 3px;font-weight:600;font-size:12.5px;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:center;gap:2px}
.minical .md:hover{background:#fff}
.minical .md.fora{color:#b3b9b8}
.minical .md.hoje{background:var(--coral);color:#fff}
.minical .md i{display:flex;gap:2px;height:5px}
.minical .md i b,.ponto{width:5px;height:5px;border-radius:50%;background:var(--salvia);display:inline-block}
.minical .md i b.c,.ponto.c{background:var(--coral)}
.minical .md.hoje i b{background:#fff}
.obras{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.obra{position:relative;text-align:left;border:0;background:#fff;border-radius:14px;padding:12px 12px 12px 16px;display:flex;flex-direction:column;gap:2px;box-shadow:0 4px 12px rgba(31,59,82,.06);overflow:hidden}
.obra::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.obra:hover{box-shadow:0 8px 20px rgba(31,59,82,.12)}
.obra .on{font-weight:700}
.obra .oc{font-size:12px;color:var(--muted)}
.obra .op{font-size:12px;color:var(--salvia-esc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.obra .ob{position:absolute;top:10px;right:10px;background:var(--coral);color:#fff;border-radius:999px;font-size:11px;font-weight:800;min-width:20px;height:20px;line-height:20px;text-align:center;padding:0 6px}

/* tarefas */
.tfiltros{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px}
.tfiltros #tfQ,.tfiltros select{border:1px solid var(--areia);border-radius:10px;padding:7px 10px;background:#fff}
.tfiltros #tfQ{min-width:220px}
.tfiltros .cb{white-space:nowrap}
.abas{display:flex;gap:4px;background:rgba(255,255,255,.45);border-radius:999px;padding:4px;width:max-content;margin-bottom:14px}
.abas button{border:0;background:none;font:inherit;font-weight:600;font-size:13.5px;padding:7px 16px;border-radius:999px;cursor:pointer;color:var(--muted)}
.abas button.on{background:var(--papel);color:var(--ink);box-shadow:var(--sombra)}
#nav2{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.tsem{overflow-x:auto}
.tsem .qcol{min-height:calc(100vh - 190px);display:flex;flex-direction:column}
.tsem .qcol h3 .dw{font-style:normal;font-weight:500;color:var(--muted);font-size:13px}.tsem .qcol h3 .dw b{color:var(--ink);text-transform:capitalize;font-weight:700}
.tsem .qcol.hoje{background:rgba(232,105,63,.07);box-shadow:inset 0 3px 0 var(--coral)}
.tsem .qcol.hoje h3 .dw b{color:var(--coral)}
.tsem .qcol.estreita{padding:10px 4px}.tsem .qcol.estreita h3{flex-direction:column;gap:2px;margin:2px 0 10px}.tsem .qcol.estreita h3 .dn{font-size:16px}.tsem .qcol.estreita h3 .dw{font-size:11px}
.tadd{margin-top:auto;border:1px dashed var(--line);background:transparent;border-radius:10px;padding:5px;color:var(--muted);cursor:pointer;font-size:15px;opacity:.6}
.tadd:hover{opacity:1;background:var(--papel)}
.quadro{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:12px;align-items:start;overflow-x:auto;padding-bottom:6px}
.qcol{background:rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.6);border-radius:18px;padding:10px;min-height:120px}
.qcol h3{display:flex;justify-content:space-between;align-items:center;margin:2px 4px 10px;font-size:14px;font-weight:700}
.qcol h3 span{background:var(--papel);border-radius:999px;padding:0 9px;font-size:12px;color:var(--muted)}
.qcol.alerta h3{color:var(--warn)}
.qcol.hoje h3 span{background:var(--coral);color:#fff}
.tcard{display:flex;gap:9px;align-items:flex-start;background:var(--papel);border-radius:14px;padding:10px 10px 10px 12px;margin-bottom:8px;box-shadow:var(--sombra);border-left:4px solid var(--c)}
.tcard .chk{margin-top:2px}
.tcard .tb{flex:1;min-width:0;cursor:pointer}
.tcard .tt{font-weight:600;line-height:1.35;font-size:13px}
.tcard .ts{font-size:12px;color:var(--muted);margin-top:2px}
.tcard.done .tt{text-decoration:line-through;color:var(--muted)}
.qcol.feitas .tcard{opacity:.7}

/* visão semana */
.semana{display:grid;grid-template-columns:var(--cols,repeat(7,minmax(0,1fr)));gap:10px}
.dia{min-width:0;overflow:hidden;background:var(--papel);border:1px solid rgba(255,255,255,.7);border-radius:18px;padding:10px;min-height:170px;box-shadow:var(--sombra)}
.dia.hoje{box-shadow:inset 0 3px 0 var(--coral),var(--sombra)}
.dia h4{margin:0 0 8px;font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:baseline}
.dia h4 small{color:var(--muted);font-weight:500;font-size:12px}
.ent{font-size:12.5px;border-left:3px solid;padding:5px 7px;margin-bottom:5px;border-radius:8px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
.ent.done{opacity:.5;text-decoration:line-through}
.ent b{font-weight:700;font-variant-numeric:tabular-nums}

/* calendário */
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.cal-head .lbl{font-weight:800;font-size:19px;margin:0 8px;min-width:210px;letter-spacing:-.2px}
.wk{display:grid;grid-template-columns:var(--cols,52px repeat(7,minmax(0,1fr)));background:var(--papel);border:1px solid rgba(255,255,255,.7);border-radius:18px;overflow:hidden;box-shadow:var(--sombra)}
.wk .hd{padding:8px 6px 6px;text-align:center;border-bottom:1px solid var(--linha);display:flex;flex-direction:column;align-items:center;line-height:1.1;min-width:0}
.wk .hd .dw{font-size:11.5px;color:var(--muted);text-transform:lowercase;font-weight:600}
.wk .hd .dn{font-weight:800;font-size:19px;color:var(--ink)}
.wk .hd.hoje .dn{color:#fff;background:var(--coral);border-radius:999px;min-width:30px;padding:0 7px}
.wk .hd.hoje .dw{color:var(--coral)}
.wk .ad{min-width:0;overflow:hidden;border-bottom:1px solid var(--linha);min-height:34px;padding:3px;border-left:1px solid var(--line-2)}
.wk .hrs{position:relative}
.wk .hr:first-child{visibility:hidden}
.wk .hd{position:relative}
.wk .hd[data-hdia]{cursor:pointer}
.wk .hd[data-hdia]:hover{background:rgba(255,255,255,.5)}
.wk .hd.hoje[data-hdia]:hover{background:rgba(232,105,63,.12)}
.hdots{position:absolute;top:50%;transform:translateY(-50%);display:flex;gap:10px;row-gap:8px;align-items:center;max-width:calc(50% - 26px);flex-wrap:wrap}
.hdots.esq{left:10px;justify-content:flex-start}
.hdots.dir{right:10px;justify-content:flex-end}
.wk .hd.hoje{background:rgba(232,105,63,.07);box-shadow:inset 0 3px 0 var(--coral)}
.wk .hd.hoje .dn{box-shadow:0 3px 10px rgba(232,105,63,.35)}
.fbtn{position:relative;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;width:92px;padding:0;border-radius:999px;border:1px solid var(--line);background:#fff;font:inherit;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
.fbtn svg{width:15px;height:15px}
.fbtn .n{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;box-sizing:border-box;background:var(--coral);color:#fff;border-radius:999px;font-size:10px;padding:0 4px;line-height:17px;text-align:center;box-shadow:0 0 0 2px var(--linho)}
.rnbtn{box-sizing:border-box;height:34px;width:54px;padding:0;border-radius:999px;border:2px solid #152033;background:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}
.rnbtn svg{height:22px;width:auto;display:block}
.rnbtn .txt{font-weight:800;font-size:12.5px;color:#7c3aed;letter-spacing:.3px}
.rnbtn.off{border-color:var(--line);background:#f1f1f1}
.rnbtn.off svg{filter:grayscale(1);opacity:.35}
.rnbtn.off .txt{color:#9ca3af;text-decoration:line-through}
.hdots .pd{width:10px;height:10px;flex:none;border-radius:50%;cursor:pointer;display:block}
.hdots .pd.ok{opacity:.35}
.hdots b{font-size:10px;color:var(--muted)}
.wk .hr{height:var(--px,48px);font-size:11px;color:var(--muted);text-align:right;padding-right:6px;transform:translateY(-7px);font-variant-numeric:tabular-nums}
.wk .col{position:relative;border-left:1px solid var(--line-2);background:repeating-linear-gradient(transparent 0 calc(var(--px,48px) - 1px),var(--line-2) calc(var(--px,48px) - 1px) var(--px,48px))}
.wk .col.hoje{background:repeating-linear-gradient(rgba(232,105,63,.05) 0 calc(var(--px,48px) - 1px),#f1e2d9 calc(var(--px,48px) - 1px) var(--px,48px))}
.ev,.adchip,.ent{-webkit-font-smoothing:auto}
.ev{font-weight:500}
.ev{position:absolute;border-radius:7px;padding:2px 5px;font-size:12px;overflow:hidden;cursor:pointer;line-height:1.3;color:var(--ink);word-break:break-word}
.ev.curto{white-space:nowrap;text-overflow:ellipsis;line-height:1.2;padding-top:1px}
.ev b{margin-right:4px;font-size:12px;font-weight:700}
.ev b{font-variant-numeric:tabular-nums}
.ev.done{opacity:.45}
.ev.movel{cursor:grab;touch-action:none}
.ev .rs{position:absolute;left:0;right:0;bottom:0;height:7px;cursor:ns-resize}

/* ================= dados ================= */
let D = null;

function matiz(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || '').trim()); if (!m) return -1;
  const n = parseInt(m[1], 16), r = (n >> 16) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255, mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;

const LOGO_RN = `<svg viewBox="575 170 782 1098" aria-label="R. Nunes"><g fill="#152033"><path d="M590 402h157L590 559zM1186 398h156v156zM590 570l171 171-171 171zM1342 570l-171 171 171 171zM590 928l164 164H590zM1342 928l-165 164h165zM633 561l154-153 153 153-153 154zM991 561l154-153 153 153-153 154z"/></g><g fill="#35465d"><path d="M812 741l154-154 153 154-153 154zM633 920l154-153 153 153-153 154zM991 920l154-153 153 153-153 154zM812 1099l154-153 153 153-153 154z"/></g><g fill="#ed7022"><circle cx="966" cy="217" r="32"/><path d="M812 382l29-28v-81h73l52-48 53 48h71v81l29 28-153 154z"/></g></svg>`;

const APP = { clientId: '10f56873-dde9-4d8c-9b53-65e4cb2326ab', tenantId: '3c50769a-f2c3-45de-a848-dac895975f88' };

async function salvarItemModal() {
  const id = modalItem._id, novo = modalItem._novo;
  const it = novo ? modalItem._rascunho : D.itens.find(i => i.id === id);
  const tit = $('#iTit').value.trim();
  if (!tit) { toast('Dê um título ao item.', true); return; }
  const rep = $('#iRep').value;
  let rec = null;
  if (rep !== 'nao') {
    if (!$('#iData').value) { toast('Informe a data de início da repetição.', true); return; }
    rec = { freq: rep, intervalo: Math.max(1, +$('#iInt').value || 1), ate: $('#iAte').value || '' };
    if (rep === 'semanal') { rec.dias = $$('.iDow:checked').map(x => +x.value); if (!rec.dias.length) rec.dias = [parseYmd($('#iData').value).getDay()]; }
    if (rep === 'mensal') {
      rec.modoMensal = $('#iModo').value;
      if (rec.modoMensal === 'posicao') { rec.posicao = +$('#iPos').value; rec.diaSemana = +$('#iDsem').value; }
      else rec.diaMes = Math.min(31, Math.max(1, +$('#iDiaMes').value || parseYmd($('#iData').value).getDate()));
    }
  }
  Object.assign(it, {
    titulo: tit, tipo: $('#iTipo').value, projetoId: $('#iProj').value,
    data: $('#iData').value, hora: $('#iHora').value, duracao: Math.max(5, +$('#iDur').value || 60), recorrencia: rec,
    participantes: $('#iPart').value.trim(), local: $('#iLocal').value.trim(), teams: $('#iTeams').checked,
    calendarioId: $('#iCal').value, showAs: $('#iSA').value, lembrete: Math.max(0, +$('#iLemb').value || 0), notas: $('#iNotas').value
  });
  it.sincronizar = !!it.data && !it.leitura && !it.demanda;
  if (it.sincronizar) it._pend = true;
  it.areaId = areaDoItem(it);
  D.config.ultimoCal = it.calendarioId;
  if (novo) D.itens.push(it);
  fecharModal(); salvar(); render();
  if (it.sincronizar || it.outlook) { await sincronizar(it); salvar(); faixaEventos = ''; render(); if (!it.erroSync) toast('Agenda atualizada.'); }
}
async function excluirItem() {

}

function pascoa(y) {

const cacheFer = new Map();

function listaFeriados(ano, uf, locais) {
  const cf = cfgFer(), key = [ano, uf, (locais || []).join(','), cf.carnaval, cf.corpus, JSON.stringify(cf.extras[uf] || []), JSON.stringify(cf.removidos[uf] || [])].join('|');

function tarefasControle(p, ini, fim) {

  const c = ctxFer(p), desde = parseYmd(p.controleDesde || ymd(segundaDe(hoje0())));

  };

    for (let seg = segundaDe(addDays(ini, -6) > desde ? addDays(ini, -6) : desde); seg <= fim; seg = addDays(seg, 7)) {
      if (addDays(seg, 6) < desde) continue;

      const dReu = reu ? parseYmd(reu.data) : ultimoUtilSemana(seg, c), d1 = primeiroUtilSemana(seg, c);

          add(pkey, 'relatorios', 'Fechar os relatórios', dReu, { mensal: nomeMes(ym) });
        } else {

let chavesCache = null, chavesAssin = '';
function chavesProjetos() {

let rodaAcum = 0, rodaPausa = 0;

  if (!['tarefas', 'calendario'].includes(vista) || $('#modalBg').classList.contains('on')) return;
  if (Math.abs(ev.deltaX) <= Math.abs(ev.deltaY) * 1.2) return;
  if (Date.now() < rodaPausa) return;
  rodaAcum += ev.deltaX;
  if (Math.abs(rodaAcum) > 140) { navegar(rodaAcum > 0 ? 1 : -1); rodaAcum = 0; rodaPausa = Date.now() + 700; }
}, { passive: true });
document.addEventListener('keydown', ev => {
  if ($('#modalBg').classList.contains('on') || ev.target.matches('input,textarea,select')) return;
  if (ev.key === 'ArrowLeft') navegar(-1); else if (ev.key === 'ArrowRight') navegar(1);
});

  ['#iRep', '#iModo'].forEach(s => $(s).addEventListener('change', updRec));

/* ================= arrastar no calendário ================= */
let drag = null, suprimirClique = false;
const SNAP = 15;
document.addEventListener('pointerdown', ev => {
  const el = ev.target.closest('.ev.movel'); if (!el || ev.button !== 0) return;
  const col = el.closest('.col'); if (!col) return;
  drag = { el, col0: col, x0: ev.clientX, y0: ev.clientY, ini: +el.dataset.ini, dur: Math.max(+el.dataset.dur, 15), dia: el.dataset.dia,
    modo: ev.target.classList.contains('rs') ? 'tam' : 'mover', ativo: false, top0: el.offsetTop, h0: el.offsetHeight };
  el.setPointerCapture(ev.pointerId);
});
document.addEventListener('pointermove', ev => {
  if (!drag) return;
  const dx = ev.clientX - drag.x0, dy = ev.clientY - drag.y0;
  if (!drag.ativo) {
    if (Math.abs(dx) < 5 && Math.abs(dy) < 5) return;
    drag.ativo = true; drag.el.classList.add('arrastando'); document.body.classList.add('arrastando');
    if (drag.modo === 'mover') { drag.el.style.left = '1px'; drag.el.style.width = 'calc(100% - 3px)'; }
  }
  const passo = Math.round(dy / PX * 60 / SNAP) * SNAP;
  if (drag.modo === 'tam') {
    drag.novaDur = Math.max(15, Math.min(drag.dur + passo, H1 * 60 - drag.ini));
    drag.el.style.height = (drag.novaDur / 60 * PX - 2) + 'px';
    drag.el.querySelector('b').textContent = `${min2hm(drag.ini)}–${min2hm(drag.ini + drag.novaDur)}`;
  } else {
    drag.novoIni = Math.max(H0 * 60, Math.min(drag.ini + passo, H1 * 60 - 15));
    // coluna sob o ponteiro
    const alvo = $$('.wk .col').find(c => { const r = c.getBoundingClientRect(); return ev.clientX >= r.left && ev.clientX < r.right; });
    if (alvo && alvo !== drag.el.parentElement) alvo.appendChild(drag.el);
    drag.novoDia = (alvo || drag.el.parentElement).dataset.coldia;
    drag.el.style.top = ((drag.novoIni - H0 * 60) / 60 * PX) + 'px';
    drag.el.querySelector('b').textContent = min2hm(drag.novoIni);
  }
});
document.addEventListener('pointerup', async ev => {
  if (!drag) return;
  const d = drag; drag = null;
  document.body.classList.remove('arrastando');
  if (!d.ativo) return; // foi um clique: o handler de click abre o item
  suprimirClique = true; setTimeout(() => suprimirClique = false, 50);
  const novoDia = d.novoDia || d.dia, novoIni = d.novoIni ?? d.ini, novaDur = d.novaDur ?? d.dur;
  if (novoDia === d.dia && novoIni === d.ini && novaDur === d.dur) return render();
  await moverNoCalendario(d.el, novoDia, novoIni, novaDur, d.dia);
});
async function moverNoCalendario(el, dia, ini, dur, diaAntigo) {
  if (el.dataset.ev) {
    const e = eventos.find(x => x.id === el.dataset.ev); if (!e) return render();
    const fimMin = ini + dur, d2 = fimMin >= 1440 ? ymd(addDays(parseYmd(dia), 1)) : dia;
    const st = `${dia}T${min2hm(ini)}:00`, en = `${d2}T${min2hm(fimMin % 1440)}:00`;
    const antes = { s: e.start.dateTime, f: e.end.dateTime };
    e.start.dateTime = st; e.end.dateTime = en; render();
    try {
      if (e._cal.fonte === 'google') await gapi('PATCH', gEv(e._cal.id, e.rawId), { start: { dateTime: st, timeZone: GTZ }, end: { dateTime: en, timeZone: GTZ } });
      else await graph('PATCH', `${calPath(e._cal.id)}/events/${e.id}`, { start: { dateTime: st, timeZone: D.config.fuso }, end: { dateTime: en, timeZone: D.config.fuso } });
      toast('Evento atualizado.');
    } catch (er) { e.start.dateTime = antes.s; e.end.dateTime = antes.f; render(); toast('Não consegui mover: ' + er.message, true); }
    return;
  }
  const it = D.itens.find(i => i.id === el.dataset.item); if (!it) return render();
  if (!it.recorrencia) {
    it.data = dia; it.hora = min2hm(ini); it.duracao = dur; if (it.outlook) it._pend = true; salvar(); render();
    if (it.sincronizar || it.outlook) { await sincronizar(it); salvar(); faixaEventos = ''; render(); }
    return;
  }
  // rotina: perguntar
  const orig = el.dataset.orig;
  abrirModal(`<h3>Mover "${esc(it.titulo)}"</h3>
    <p>De <b>${fmtData(diaAntigo)}</b> para <b>${fmtData(dia)} ${min2hm(ini)}–${min2hm(ini + dur)}</b>.</p><p class="hint">É uma rotina que se repete. O que você quer alterar?</p>
    <div class="acts"><button class="btn l" data-acao="fechar">Cancelar</button><button class="btn" data-mover="um">Só este dia</button><button class="btn pri" data-mover="serie">Toda a série</button></div>`);
  moverNoCalendario._p = { it, orig, dia, ini, dur, diaAntigo };
}
async function confirmarMover(qual) {
  const { it, orig, dia, ini, dur, diaAntigo } = moverNoCalendario._p; fecharModal();
  if (qual === 'um') {
    it.excecoes = it.excecoes || {};
    it.excecoes[orig] = { data: dia, hora: min2hm(ini), duracao: dur };
    if (it.outlook) it._pend = true;
    salvar(); render();
    if (it.sincronizar && it.outlook) { try { await moverInstancia(it, orig, dia, ini, dur); delete it._pend; toast('Agenda atualizada (só este dia).'); } catch (e) { toast('Agenda: ' + e.message, true); } salvar(); faixaEventos = ''; render(); }
    return;
  }
  // série: muda horário/duração; se mudou de dia, desloca os dias da repetição
  const delta = diffDays(parseYmd(diaAntigo), parseYmd(dia)), r = it.recorrencia;
  it.hora = min2hm(ini); it.duracao = dur;
  if (delta) {
    it.data = ymd(addDays(parseYmd(it.data), delta));
    if (r.freq === 'semanal') r.dias = (r.dias && r.dias.length ? r.dias : [parseYmd(diaAntigo).getDay()]).map(x => ((x + delta) % 7 + 7) % 7);
    if (r.freq === 'mensal' && r.modoMensal !== 'posicao') r.diaMes = Math.min(31, Math.max(1, (+r.diaMes || 1) + delta));
    if (r.freq === 'mensal' && r.modoMensal === 'posicao') r.diaSemana = ((+r.diaSemana + delta) % 7 + 7) % 7;
  }
  it.excecoes = {};
  if (it.outlook) it._pend = true;
  salvar(); render();
  if (it.sincronizar || it.outlook) { await sincronizar(it); salvar(); faixaEventos = ''; render(); }
}
async function moverInstancia(it, orig, dia, ini, dur) {
  const cal = it.outlook.calendarId, off = tzOff();
  const a = `${orig}T00:00:00${off}`, b = `${ymd(addDays(parseYmd(orig), 1))}T00:00:00${off}`;
  const fimMin = ini + dur, d2 = fimMin >= 1440 ? ymd(addDays(parseYmd(dia), 1)) : dia;
  const st = `${dia}T${min2hm(ini)}:00`, en = `${d2}T${min2hm(fimMin % 1440)}:00`;
  if (ehG(cal)) {
    const j = await gapi('GET', `${gEv(cal, it.outlook.eventId)}/instances?timeMin=${encodeURIComponent(a)}&timeMax=${encodeURIComponent(b)}`);
    const inst = (j.items || [])[0]; if (!inst) throw new Error('ocorrência não encontrada no Google');
    await gapi('PATCH', gEv(cal, inst.id), { start: { dateTime: st, timeZone: GTZ }, end: { dateTime: en, timeZone: GTZ } });
  } else {
    const j = await graph('GET', `${calPath(cal)}/events/${it.outlook.eventId}/instances?startDateTime=${encodeURIComponent(a)}&endDateTime=${encodeURIComponent(b)}&$select=id`);
    const inst = (j.value || [])[0]; if (!inst) throw new Error('ocorrência não encontrada no Outlook');
    await graph('PATCH', `${calPath(cal)}/events/${inst.id}`, { start: { dateTime: st, timeZone: D.config.fuso }, end: { dateTime: en, timeZone: D.config.fuso } });
  }
}

/* ================= lembretes ================= */
function pedirNotif() { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); }
function notificar(tit, txt) {
  toast(`${tit}: ${txt}`);
  if ('Notification' in window && Notification.permission === 'granted') { try { new Notification(tit, { body: txt }); } catch { } }
  else pedirNotif();
}
const avisados = new Set();
function verificarLembretes() {
  if (!D.config.notificacoes) return;
  const n = new Date(), hs = ymd(n), agora = n.getHours() * 60 + n.getMinutes();
  const agoraTxt = `${hs}T${min2hm(agora)}`;
  if (agora >= 8 * 60 && D.config.ultimoResumoCtl !== hs) {
    const pc = pendenciasControle();
    D.config.ultimoResumoCtl = hs; salvar();
    if (pc.length) notificar(`${pc.length} pendência(s) de controle`, [...new Set(pc.map(x => x.p.nome))].slice(0, 4).join(', '));
  }
  D.itens.forEach(it => {
    if (!it.demanda || !it.lembrarEm || it.concluidas[it.data] || avisados.has('d' + it.id + it.lembrarEm)) return;
    if (agoraTxt >= it.lembrarEm && agoraTxt.slice(0, 10) === it.lembrarEm.slice(0, 10)) {
      avisados.add('d' + it.id + it.lembrarEm);
      const p = projeto(it.projetoId);
      notificar('Lembrete: ' + it.titulo, `${p ? p.nome + ' · ' : ''}prazo ${fmtData(it.data)}`);
    }
  });
  D.itens.forEach(it => {
    if (!it.hora || (it.sincronizar && it.outlook)) return;
    if (!ocorrencias(it, hoje0(), hoje0()).length || it.concluidas[hs]) return;
    const ini = hm2min(it.hora), k = it.id + hs;
    if (agora >= ini - (+it.lembrete || 0) && agora <= ini && !avisados.has(k)) {
      avisados.add(k);
      const p = projeto(it.projetoId);
      notificar(`${it.hora} · ${it.titulo}`, [area(it.areaId) && area(it.areaId).nome, p && p.nome].filter(Boolean).join(' · ') || 'Lembrete');
    }
  });
}

  if (!conectado()) return telaLogin(erroOutlook);
  try { await carregar(); }
  catch (e) { return telaLogin('Não consegui ler seus dados no OneDrive: ' + e.message); }
  document.body.classList.remove('login');
  garantirPessoal();
  migrarProjetos();
  migrarCores();
  repararVinculos();
  gRestaurar();
  render();
  if (gOk()) gCarregarCalendarios().then(() => { faixaEventos = ''; render(); }).catch(e => { erroGoogle = e.message; });
  carregarCalendarios().then(async () => {
    await sincronizarPendentes();
    if (!D.config.titulosV2) {
      const l = D.itens.filter(it => it.outlook && it.sincronizar && !it.vinculado && !it.leitura && !ehG(it.outlook.calendarId));
      for (const it of l) await sincronizar(it);
      D.config.titulosV2 = true; salvar();
      if (l.length) toast(`${l.length} evento(s) atualizados no Outlook com o novo padrão de título.`);
    }
    render();
  }).catch(e => { erroOutlook = e.message; render(); });
  pedirNotif();
  setInterval(verificarLembretes, 30000); verificarLembretes();
  setInterval(() => { if (vista === 'calendario') posicionarCalendario(); }, 60000);
  setInterval(atualizarAgora, 60000);
  window.addEventListener('focus', () => { if (Date.now() - ultimoRefresh > 8000) atualizarAgora(); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - ultimoRefresh > 8000) atualizarAgora(); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') recarregarSeMudou(); });
  window.addEventListener('beforeunload', e => { if (alterado) { gravar(); e.preventDefault(); } });
})();
</script>
