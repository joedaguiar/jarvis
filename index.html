<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meus Afazeres</title>
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --ink:#1d2330; --muted:#6b7385; --line:#e3e6ec;
  --accent:#2563eb; --accent-soft:#e8efff; --danger:#c0392b; --ok:#1e8e3e; --warn:#b7791f;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg);display:flex}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
/* sidebar */
#side{width:220px;flex:none;background:#151a24;color:#cfd5e2;display:flex;flex-direction:column;padding:16px 10px}
#side h1{font-size:17px;color:#fff;margin:4px 10px 18px;letter-spacing:.2px}
#side nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:inherit;padding:9px 12px;border-radius:8px;margin-bottom:2px}
#side nav button:hover{background:#222939}
#side nav button.on{background:#2b3346;color:#fff;font-weight:600}
#side .ico{width:18px;text-align:center;opacity:.9}
#side .grow{flex:1}
#btnMini{background:none;border:0;color:#8b93a7;font-size:16px;padding:8px;margin-top:6px;border-radius:8px;text-align:center}
#btnMini:hover{background:#222939;color:#fff}
body.mini #side{width:58px;padding:12px 6px}
body.mini #side .tx{display:none}
body.mini #side h1{margin:4px 0 16px;text-align:center}
body.mini #side nav button{justify-content:center;padding:10px 0}
body.mini #side .ico{font-size:17px;width:auto}
body.mini #outlookStatus{padding:8px 0;text-align:center;background:none}
body.mini #outlookStatus .det{display:none}
body.mini #outlookStatus .dot{margin:3px}
#outlookStatus{font-size:12px;padding:10px 12px;border-radius:8px;background:#1d2332;line-height:1.4}
#outlookStatus .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
/* main */
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#top{display:flex;align-items:center;gap:10px;padding:14px 22px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
#top h2{margin:0;font-size:19px;margin-right:auto}
#filtros{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.chip .sw{width:9px;height:9px;border-radius:50%}
.chip.off{opacity:.4}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 13px}
.btn:hover{background:#f0f2f6}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.07)}
.btn.dan{color:var(--danger)}
.btn.sm{padding:4px 9px;font-size:12.5px}
#view{flex:1;overflow:auto;padding:20px 22px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px}
.card h3{margin:0 0 10px;font-size:14px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.empty{color:var(--muted);font-style:italic;padding:4px 0}
.row{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:8px;border-bottom:1px solid #f0f1f4}
.row:last-child{border-bottom:0}
.row:hover{background:#f8f9fb}
.row .time{width:92px;flex:none;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.row .bar{width:4px;align-self:stretch;border-radius:2px;flex:none}
.row .txt{flex:1;min-width:0;cursor:pointer}
.row .t{font-weight:500}
.row .s{font-size:12.5px;color:var(--muted)}
.row.done .t{text-decoration:line-through;color:var(--muted)}
.chk{width:18px;height:18px;flex:none;accent-color:var(--ok);cursor:pointer}
.tag{font-size:11px;border-radius:4px;padding:1px 6px;background:#eef0f4;color:#4a5263;margin-left:6px;white-space:nowrap}
.tag.ol{background:#e6f0ff;color:#1f4fb8}
.tag.err{background:#fdecea;color:var(--danger)}
.tag.late{background:#fff4e0;color:var(--warn)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
/* semana */
.semana{display:grid;grid-template-columns:var(--cols,repeat(7,minmax(0,1fr)));gap:10px}
.dia{min-width:0;overflow:hidden}
.ent{overflow:hidden;text-overflow:ellipsis}
.dia{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px;min-height:160px}
.dia.hoje{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.dia h4{margin:0 0 8px;font-size:13px;display:flex;justify-content:space-between;align-items:baseline}
.dia h4 small{color:var(--muted);font-weight:400}
.ent{font-size:12.5px;border-left:3px solid;padding:4px 6px;margin-bottom:5px;border-radius:4px;background:#f7f8fa;cursor:pointer}
.ent.done{opacity:.5;text-decoration:line-through}
.ent b{font-weight:600;font-variant-numeric:tabular-nums}
/* calendario */
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.cal-head .lbl{font-weight:600;font-size:16px;margin:0 8px;min-width:220px}
.wk{display:grid;grid-template-columns:var(--cols,52px repeat(7,minmax(0,1fr)));background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.wk .hd{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);font-size:12.5px;background:#fafbfc}
.wk .hd.hoje{color:var(--accent);font-weight:700}
.wk .ad{min-width:0;overflow:hidden;border-bottom:1px solid var(--line);min-height:26px;padding:2px;border-left:1px solid var(--line)}
.wk .hrs{position:relative}
.wk .hr{height:48px;font-size:11px;color:var(--muted);text-align:right;padding-right:6px;transform:translateY(-7px)}
.wk .col{position:relative;border-left:1px solid var(--line);background:repeating-linear-gradient(#fff 0 47px,#eef0f3 47px 48px)}
.wk .col.hoje{background:repeating-linear-gradient(#f7faff 0 47px,#e8edf6 47px 48px)}
.ev{position:absolute;border-radius:5px;padding:2px 5px;font-size:11.5px;overflow:hidden;color:#fff;cursor:pointer;line-height:1.25;border:1px solid rgba(255,255,255,.6)}
.ev.done{opacity:.45}
.ev.movel{cursor:grab;touch-action:none}
@keyframes gira{to{transform:rotate(360deg)}}
.btn.girando{animation:gira 1s linear infinite}
.semana,.mes,.wk{touch-action:pan-y}
.ev .rs{position:absolute;left:0;right:0;bottom:0;height:7px;cursor:ns-resize}
.ev.arrastando{opacity:.85;z-index:5;box-shadow:0 6px 18px rgba(0,0,0,.3);cursor:grabbing;transition:none}
body.arrastando,body.arrastando *{user-select:none!important}
.adchip{font-size:11.5px;color:#fff;border-radius:4px;padding:1px 5px;margin:1px 0;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowline{position:absolute;left:0;right:0;height:2px;background:#e53935;z-index:3}
.mes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.mes .hd{padding:6px;text-align:center;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.mes .cel{min-width:0;overflow:hidden;min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;cursor:pointer}
.mes .cel.fora{background:#fafbfc;color:#aab}
.mes .cel.hoje .n{background:var(--accent);color:#fff;border-radius:50%}
.mes .n{display:inline-block;width:22px;height:22px;text-align:center;line-height:22px;font-size:12px}
.mes .mais{font-size:11px;color:var(--muted)}
/* projetos */
.proj-wrap{display:grid;grid-template-columns:280px 1fr;gap:16px;align-items:start}
.plist .area{margin-bottom:14px}
.plist .ah{display:flex;align-items:center;gap:8px;font-weight:600;padding:6px 8px;border-radius:8px;cursor:pointer}
.plist .ah:hover,.plist .pi:hover{background:#eef1f6}
.plist .ah.sel,.plist .pi.sel{background:var(--accent-soft)}
.plist .pi{padding:6px 8px 6px 28px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between}
.plist .pi small{color:var(--muted)}
.sw{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:4px 0 6px}
/* modal */
#modalBg{position:fixed;inset:0;background:rgba(15,20,30,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50}
#modalBg.on{display:flex}
#modal{background:#fff;border-radius:14px;width:min(620px,100%);padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
#modal h3{margin:0 0 14px;font-size:18px}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.f label{font-size:12.5px;color:var(--muted);font-weight:600}
.f input,.f select,.f textarea{border:1px solid #cfd4de;border-radius:8px;padding:7px 9px;background:#fff}
.f textarea{min-height:70px;resize:vertical}
.fr{display:flex;gap:12px;flex-wrap:wrap}
.fr>.f{flex:1;min-width:130px}
.dows{display:flex;gap:4px}
.dows label{border:1px solid #cfd4de;border-radius:6px;padding:4px 8px;font-size:12.5px;cursor:pointer;color:var(--ink);font-weight:500}
.dows input{display:none}
.dows input:checked+span{color:var(--accent);font-weight:700}
.dows label:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}
.cb{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;align-items:center}
.acts .l{margin-right:auto}
.box{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px;background:#fafbfc}
.hint{font-size:12.5px;color:var(--muted)}
#toast{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:#1d2330;color:#fff;padding:10px 14px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:380px;font-size:13.5px}
.toast.err{background:var(--danger)}
table.cfg{border-collapse:collapse;width:100%}
body.login #nav,body.login #btnNovo,body.login #btnReuniao{display:none}
@media (max-width:820px){
  body{flex-direction:column}
  #side{width:auto;order:2;flex-direction:row;padding:4px 6px;border-top:1px solid #2b3346}
  #side h1,#side .grow,#outlookStatus{display:none}
  body.mini #side{width:auto;padding:4px 6px}
  #btnMini{display:none}
  body.mini #side nav button{padding:6px 4px}
  #side nav{display:flex;width:100%;justify-content:space-around}
  #side nav button{flex-direction:column;gap:1px;font-size:10.5px;padding:6px 4px;width:auto;margin:0}
  #main{order:1;min-height:0}
  #top{padding:10px 12px;gap:6px}
  #top h2{font-size:17px;width:100%}
  #view{padding:12px 10px 30px}
  .grid2,.proj-wrap{grid-template-columns:1fr}
  .semana{grid-template-columns:1fr}
  .wk{min-width:760px}
  .row .time{width:74px;font-size:12px}
  #modalBg{padding:10px}
}
table.cfg td{padding:6px 4px;border-bottom:1px solid #f0f1f4;vertical-align:middle}
</style>
</head>
<body>
<aside id="side">
  <h1><span>✔</span><span class="tx"> Meus Afazeres</span></h1>
  <nav id="nav">
    <button data-v="hoje" title="Hoje"><span class="ico">☀</span><span class="tx">Hoje</span></button>
    <button data-v="semana" title="Semana"><span class="ico">▤</span><span class="tx">Semana</span></button>
    <button data-v="calendario" title="Calendário"><span class="ico">▦</span><span class="tx">Calendário</span></button>
    <button data-v="projetos" title="Empresas e projetos"><span class="ico">◧</span><span class="tx">Empresas e projetos</span></button>
    <button data-v="config" title="Configurações"><span class="ico">⚙</span><span class="tx">Configurações</span></button>
  </nav>
  <div class="grow"></div>
  <div id="outlookStatus"></div>
  <button id="btnMini" title="Expandir/recolher menu">»</button>
</aside>
<div id="main">
  <div id="top">
    <h2 id="titulo">Hoje</h2>
    <div id="filtros"></div>
    <button class="btn" id="btnReuniao">+ Reunião</button>
    <button class="btn pri" id="btnNovo">+ Novo</button>
  </div>
  <div id="view"></div>
</div>
<div id="modalBg"><div id="modal"></div></div>
<div id="toast"></div>

<script src="msal-browser.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
"use strict";
/* ================= utilidades ================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; };
const diffDays = (a, b) => Math.round((b - a) / 864e5);
const hoje0 = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const segunda = d => addDays(d, -((d.getDay() + 6) % 7));
const domingo = d => addDays(d, -d.getDay());
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DIAS = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
const DIAS_L = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const POS = { 1: 'primeira', 2: 'segunda', 3: 'terceira', 4: 'quarta', '-1': 'última' };
const TIPOS = { tarefa: 'Tarefa', entrega: 'Entrega', rotina: 'Rotina', reuniao: 'Reunião' };
const fmtData = s => { const d = parseYmd(s); return `${DIAS[d.getDay()]}, ${d.getDate()} ${MESES[d.getMonth()].slice(0, 3)}`; };
const hm2min = h => { const [a, b] = h.split(':').map(Number); return a * 60 + b; };
const min2hm = m => `${pad(Math.floor(m / 60) % 24)}:${pad(m % 60)}`;
function toast(msg, err) {
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg;
  $('#toast').appendChild(t); setTimeout(() => t.remove(), err ? 8000 : 3500);
}

/* ================= dados ================= */
let D = null;
const CORES = ['#2563eb', '#16a34a', '#9333ea', '#ea580c', '#0891b2', '#db2777', '#ca8a04', '#475569'];
function semente() {
  const a = { rn: uid(), jf: uid(), mg: uid(), ps: uid() };
  const obra = uid();
  const hojeS = ymd(hoje0());
  return {
    versao: 1,
    config: {
      fuso: 'E. South America Standard Time',
      calendarioPadrao: '', calendariosVisiveis: null, lembretePadrao: 15, notificacoes: true
    },
    areas: [
      { id: a.rn, nome: 'R. Nunes', cor: '#2563eb', calendarioId: '' },
      { id: a.jf, nome: 'JF', cor: '#16a34a', calendarioId: '' },
      { id: a.mg, nome: 'Magi', cor: '#9333ea', calendarioId: '' },
      { id: a.ps, nome: 'Pessoal', cor: '#ea580c', calendarioId: '' }
    ],
    projetos: [{ id: obra, areaId: a.rn, nome: 'Obra exemplo (apague ou renomeie)', tipo: 'obra', descricao: '' }],
    itens: [
      novoItemBase({ areaId: a.rn, projetoId: obra, tipo: 'rotina', titulo: 'Relatório semanal da obra', data: hojeS, hora: '16:00', duracao: 60, recorrencia: { freq: 'semanal', intervalo: 1, dias: [5] } }),
      novoItemBase({ areaId: a.rn, projetoId: obra, tipo: 'rotina', titulo: 'Medição mensal', data: hojeS, hora: '', recorrencia: { freq: 'mensal', intervalo: 1, modoMensal: 'dia', diaMes: 25 } }),
      novoItemBase({ areaId: a.ps, tipo: 'rotina', titulo: 'Academia', data: hojeS, hora: '06:30', duracao: 60, recorrencia: { freq: 'semanal', intervalo: 1, dias: [1, 3, 5] } }),
      novoItemBase({ areaId: a.ps, tipo: 'rotina', titulo: 'Almoço', data: hojeS, hora: '12:00', duracao: 60, recorrencia: { freq: 'semanal', intervalo: 1, dias: [1, 2, 3, 4, 5] } })
    ]
  };
}
function novoItemBase(o) {
  return Object.assign({
    id: uid(), areaId: '', projetoId: '', tipo: 'tarefa', titulo: '', data: '', hora: '', duracao: 60,
    recorrencia: null, lembrete: 15, notas: '', participantes: '', teams: false, local: '',
    sincronizar: false, calendarioId: '', outlook: null, erroSync: '', concluidas: {}, excecoes: {}, criado: new Date().toISOString()
  }, o);
}
const area = id => D.areas.find(a => a.id === id);
const projeto = id => D.projetos.find(p => p.id === id);
function calObj(id) { const l = todosCals(); if (id === '@principal') id = ''; return id ? l.find(c => c.id === id) : l.find(c => c.padrao); }
function corDoCal(id) { const l = todosCals(), c = calObj(id); return c ? corCal(c, l.indexOf(c)) : ''; }
const corItem = it => corDoCal(calendarioDoItem(it)) || (area(it.areaId) || {}).cor || '#64748b';
function areaDoItem(it) {
  const p = projeto(it.projetoId); if (p) return p.areaId;
  const cal = calendarioDoItem(it), a = D.areas.find(a => a.calendarioId && a.calendarioId === cal);
  return a ? a.id : (it.areaId || '');
}
function chaveFiltro(calId) {
  const c = calObj(calId); if (!c) return 'sem';
  const g = (D.config.gruposCal || {})[c.id];
  return g ? 'grp:' + g : c.id;
}
function gruposFiltro() {
  const vis = new Set(D.config.calendariosVisiveis || []), l = todosCals(), m = new Map();
  l.filter(c => vis.has(c.id)).forEach(c => {
    const k = chaveFiltro(c.id), g = (D.config.gruposCal || {})[c.id];
    if (!m.has(k)) m.set(k, { k, nome: g || ((c.fonte === 'google' ? 'Google · ' : '') + c.nome), cor: corCal(c, l.indexOf(c)), n: 0 });
    m.get(k).n++;
  });
  return [...m.values()].sort((a, b) => a.nome.localeCompare(b.nome));
}
const filtrado = it => filtroOff.has(chaveFiltro(calendarioDoItem(it)));

const APP = { clientId: '10f56873-dde9-4d8c-9b53-65e4cb2326ab', tenantId: '3c50769a-f2c3-45de-a848-dac895975f88' };
const GRAPH = 'https://graph.microsoft.com/v1.0';
const PASTA = '/me/drive/root:/Apps/MeusAfazeres';
let carregado = false, alterado = false;
function normalizar() {
  D.config = Object.assign({ fuso: 'E. South America Standard Time', calendarioPadrao: '', calendariosVisiveis: null, lembretePadrao: 15, notificacoes: true }, D.config || {});
  D.areas = D.areas || []; D.projetos = D.projetos || []; D.itens = (D.itens || []).map(i => Object.assign(novoItemBase({}), i));
}
async function carregar() {
  const t = await token();
  const r = await fetch(`${GRAPH}${PASTA}/dados.json:/content`, { headers: { Authorization: 'Bearer ' + t }, cache: 'no-store' });
  if (r.status === 404) { D = semente(); carregado = true; await gravar(); return; }
  if (!r.ok) { const j = await r.json().catch(() => null); throw new Error((j && j.error && j.error.message) || ('erro ' + r.status)); }
  D = await r.json(); normalizar(); carregado = true;
}
let tSalvar = null;
function salvar() { alterado = true; clearTimeout(tSalvar); tSalvar = setTimeout(gravar, 600); }
async function putArquivo(caminho, txt) {
  const t = await token();
  const r = await fetch(`${GRAPH}${PASTA}/${caminho}:/content`, { method: 'PUT', headers: { Authorization: 'Bearer ' + t, 'Content-Type': 'application/json' }, body: txt });
  if (!r.ok) { const j = await r.json().catch(() => null); throw new Error((j && j.error && j.error.message) || ('erro ' + r.status)); }
}
async function gravar() {
  clearTimeout(tSalvar);
  if (!carregado || !conectado()) return;
  try {
    const hojeS = ymd(new Date()), backup = D.config.ultimoBackup !== hojeS;
    if (backup) D.config.ultimoBackup = hojeS;
    const txt = JSON.stringify(D);
    await putArquivo('dados.json', txt);
    alterado = false;
    if (backup) putArquivo(`backups/dados-${hojeS}.json`, txt).catch(() => { });

function entradas(ini, fim) {

  const porEvento = new Map(); // eventId -> item (itens cuja agenda foi carregada: mostra o evento real)
  D.itens.forEach(it => { if (it.outlook && it.outlook.eventId && !it._pend && calsCarregados.has(calReal(it.outlook.calendarId))) porEvento.set(it.outlook.eventId, it); });

      const x = exc[d];

      const data = (x && x.data) || d, hora = x && x.hora !== undefined ? x.hora : it.hora, dur = (x && x.duracao) || it.duracao;

    if (!it.recorrencia && it.data && it.data < hs && !it.concluidas[it.data]) atr.push({ k: 'item', it, data: it.data, hora: it.hora, titulo: it.titulo, cor: corItem(it), feito: false });

const H0 = 5, H1 = 24, PX = 48;
function colunasSemana(ini, ent, prefixo) {
  const cols = [];
  for (let i = 0; i < 7; i++) {
    const dd = addDays(ini, i), d = ymd(dd), fds = dd.getDay() === 0 || dd.getDay() === 6;
    cols.push(fds && !ent.some(x => x.data === d) ? 'minmax(0,.35fr)' : 'minmax(0,1fr)');
  }
  return (prefixo ? prefixo + ' ' : '') + cols.join(' ');
}
function vCalendario() {
  const head = `<div class="cal-head"><button class="btn" data-acao="calAnt">‹</button><button class="btn" data-acao="calHoje">Hoje</button><button class="btn" data-acao="calProx">›</button>
    <span class="lbl" id="calLbl"></span><span style="flex:1"></span>
    <button class="btn ${modoCal === 'semana' ? 'pri' : ''}" data-acao="modoSemana">Semana</button><button class="btn ${modoCal === 'mes' ? 'pri' : ''}" data-acao="modoMes">Mês</button>
    ${conectado() || gOk() ? `<span id="atualizado" class="hint" style="margin-left:4px"></span><button class="btn ${carregando ? 'girando' : ''}" data-acao="recarregar" title="Buscar as agendas de novo">⟳</button>` : ''}</div>`;
  const hs = ymd(hoje0());
  if (modoCal === 'mes') {
    const m0 = new Date(refCal.getFullYear(), refCal.getMonth(), 1), ini = domingo(m0), fim = addDays(ini, 41);
    carregarEventos(ini, fim);
    const ent = entradas(ini, fim);
    let g = `<div class="mes">${[0, 1, 2, 3, 4, 5, 6].map(i => `<div class="hd">${DIAS[i]}</div>`).join('')}`;
    for (let i = 0; i < 42; i++) {
      const dd = addDays(ini, i), d = ymd(dd), l = ent.filter(x => x.data === d);
      g += `<div class="cel ${dd.getMonth() !== m0.getMonth() ? 'fora' : ''} ${d === hs ? 'hoje' : ''}" data-dia="${d}"><span class="n">${dd.getDate()}</span>
        ${l.slice(0, 4).map(x => `<div class="adchip" style="${estiloSA(x.sa, x.cor)}${x.feito ? 'opacity:.45' : ''}" ${x.k === 'item' ? `data-item="${x.it.id}"` : `data-ev="${esc(x.e.id)}"`}>${x.hora ? x.hora + ' ' : ''}${esc(x.titulo)}</div>`).join('')}
        ${l.length > 4 ? `<div class="mais">+${l.length - 4} mais</div>` : ''}</div>`;
    }
    return head.replace('<span class="lbl" id="calLbl"></span>', `<span class="lbl" style="text-transform:capitalize">${MESES[m0.getMonth()]} ${m0.getFullYear()}</span>`) + g + '</div>';
  }
  const ini = domingo(refCal), fim = addDays(ini, 6);
  carregarEventos(ini, fim);
  const ent = entradas(ini, fim);
  let g = `<div class="wk" style="--cols:${colunasSemana(ini, ent, '52px')}"><div class="hd"></div>`;
  for (let i = 0; i < 7; i++) { const dd = addDays(ini, i); g += `<div class="hd ${ymd(dd) === hs ? 'hoje' : ''}">${DIAS[dd.getDay()]} ${dd.getDate()}</div>`; }
  g += `<div class="ad" style="border-left:0;font-size:10px;color:var(--muted);padding-top:6px;text-align:right">dia todo</div>`;
  for (let i = 0; i < 7; i++) {
    const d = ymd(addDays(ini, i));
    g += `<div class="ad">${ent.filter(x => x.data === d && !x.hora).map(x => `<div class="adchip" style="${estiloSA(x.sa, x.cor)}${x.feito ? 'opacity:.45' : ''}" ${x.k === 'item' ? `data-item="${x.it.id}"` : `data-ev="${esc(x.e.id)}"`}>${esc(x.titulo)}</div>`).join('')}</div>`;
  }
  g += `<div class="hrs">${Array.from({ length: H1 - H0 }, (_, i) => `<div class="hr">${pad(H0 + i)}:00</div>`).join('')}</div>`;
  for (let i = 0; i < 7; i++) {
    const d = ymd(addDays(ini, i));
    const evs = layout(ent.filter(x => x.data === d && x.hora));
    g += `<div class="col ${d === hs ? 'hoje' : ''}" data-coldia="${d}" style="height:${(H1 - H0) * PX}px">${evs.map(x => {
      const s = Math.max(hm2min(x.hora), H0 * 60), e = Math.max(Math.min(hm2min(x.fim || x.hora) || s + 30, H1 * 60), s + 20);
      const top = (s - H0 * 60) / 60 * PX, h = (e - s) / 60 * PX - 2;
      const movel = x.k === 'item' ? !x.it.leitura : (x.e._cal.podeEditar && !x.e.isAllDay);
      return `<div class="ev ${x.feito ? 'done' : ''} ${movel ? 'movel' : ''}" title="${esc(x.titulo + (x.sa && SHOWAS[x.sa] ? ' · ' + SHOWAS[x.sa] : ''))}" style="top:${top}px;height:${h}px;left:calc(${x._c / x._n * 100}% + 1px);width:calc(${100 / x._n}% - 3px);${estiloSA(x.sa, x.cor)}" ${x.k === 'item' ? `data-item="${x.it.id}" data-orig="${x.orig}"` : `data-ev="${esc(x.e.id)}"`} data-ini="${hm2min(x.hora)}" data-dur="${hm2min(x.fim || x.hora) - hm2min(x.hora)}" data-dia="${x.data}"><b>${x.hora}</b> ${esc(x.titulo)}${movel ? '<div class="rs"></div>' : ''}</div>`;
    }).join('')}${d === hs ? `<div class="nowline" id="nowline"></div>` : ''}</div>`;
  }
  return head.replace('<span class="lbl" id="calLbl"></span>', `<span class="lbl">${ini.getDate()} ${MESES[ini.getMonth()].slice(0, 3)} – ${fim.getDate()} ${MESES[fim.getMonth()].slice(0, 3)} ${fim.getFullYear()}</span>`) + g + '</div>';
}
function layout(lst) {
  // distribui eventos sobrepostos em colunas
  const ev = lst.map(x => Object.assign(x, { _s: hm2min(x.hora), _e: Math.max(hm2min(x.fim || x.hora), hm2min(x.hora) + 20) })).sort((a, b) => a._s - b._s);
  let grupo = [], fimG = -1;
  const fecha = () => { const n = Math.max(1, ...grupo.map(g => g._c + 1)); grupo.forEach(g => g._n = n); grupo = []; };
  ev.forEach(x => {
    if (x._s >= fimG && grupo.length) fecha();
    const usadas = grupo.filter(g => g._e > x._s).map(g => g._c);
    let c = 0; while (usadas.includes(c)) c++;
    x._c = c; grupo.push(x); fimG = Math.max(fimG, x._e);
  });
  if (grupo.length) fecha();
  return ev;
}
function posicionarCalendario() {
  const n = new Date(), nl = $('#nowline');
  if (nl) nl.style.top = ((n.getHours() * 60 + n.getMinutes() - H0 * 60) / 60 * PX) + 'px';
}

function secoesItens(itens, ctx) {
  const ctxA = esc(JSON.stringify(ctx));

    const l = itens.filter(i => i.tipo === tipo);
    return `<div class="card"><div class="sec-h"><h3 style="margin:0">${titulo}</h3><button class="btn sm" data-novo-tipo="${tipo}" data-ctx="${ctxA}">+ ${TIPOS[tipo]}</button></div>
      ${l.length ? l.map(it => {
        const prox = proximaOcorrencia(it);
        const det = [it.recorrencia ? descRec(it.recorrencia) : (it.data ? fmtData(it.data) : 'Sem data'), it.hora ? it.hora : '', prox && it.recorrencia ? 'próxima: ' + fmtData(prox) : ''].filter(Boolean).join(' · ');
        const feito = !it.recorrencia && (it.concluidas[it.data] || it.concluidas['-']);
        return `<div class="row ${feito ? 'done' : ''}"><div class="bar" style="background:${corItem(it)}"></div><div class="txt" data-item="${it.id}"><div class="t">${esc(it.titulo)}${tagsItem(it)}</div><div class="s">${esc(det)}</div></div></div>`;
      }).join('') : `<div class="empty">${vazio}</div>`}</div>`;
  };
  return sec('rotina', 'Rotinas', 'Nenhuma rotina. Ex.: relatório semanal, medição mensal, reunião de obra.') +
    sec('entrega', 'Entregas', 'Nenhuma entrega pontual.') + sec('reuniao', 'Reuniões', 'Nenhuma reunião.') + sec('tarefa', 'Tarefas', 'Nenhuma tarefa avulsa.');
}

function modalItem(it, novo) {

async function salvarEvento() {

document.addEventListener('click', async ev => {
  const t = ev.target;
  if (suprimirClique) { suprimirClique = false; ev.stopPropagation(); return; }
  const mv = t.closest('[data-mover]'); if (mv) return confirmarMover(mv.dataset.mover);
  if (t.matches('#modalBg')) return fecharModal();

  const conc = t.closest('[data-conc]');
  if (conc) {
    const [id, d] = conc.dataset.conc.split('|'), it = D.itens.find(i => i.id === id);
    if (it) { if (conc.checked) it.concluidas[d] = true; else delete it.concluidas[d]; salvar(); setTimeout(render, 150); }
    return;
  }
  const fi = t.closest('[data-filtro]');
  if (fi) return; // tratado no change
  if (filtroAberto && !t.closest('#filtroPop') && !t.closest('[data-acao=abrirFiltro]')) { filtroAberto = false; renderFiltros(); }
  const iEl = t.closest('[data-item]');
  if (iEl) { ev.stopPropagation(); const it = D.itens.find(i => i.id === iEl.dataset.item); if (it) modalItem(it, false); return; }
  const eEl = t.closest('[data-ev]');
  if (eEl) { ev.stopPropagation(); const e = eventos.find(x => x.id === eEl.dataset.ev); if (e) modalEvento(e); return; }
  const nd = t.closest('[data-novo-data]'); if (nd) return novoItem({ data: nd.dataset.novoData });
  const nt = t.closest('[data-novo-tipo]'); if (nt) return novoItem(Object.assign({ tipo: nt.dataset.novoTipo }, JSON.parse(nt.dataset.ctx)));
  const cel = t.closest('[data-dia]'); if (cel) { refCal = parseYmd(cel.dataset.dia); modoCal = 'semana'; return render(); }
  const col = t.closest('[data-coldia]');
  if (col) { const y = ev.clientY - col.getBoundingClientRect().top; const m = Math.floor((y / PX * 60 + H0 * 60) / 30) * 30; return novoItem({ data: col.dataset.coldia, hora: min2hm(m) }); }
  const sa = t.closest('[data-selarea]'); if (sa) { selProj = { tipo: 'area', id: sa.dataset.selarea }; return render(); }
  const sp = t.closest('[data-selproj]'); if (sp) { selProj = { tipo: 'proj', id: sp.dataset.selproj }; vista = 'projetos'; return render(); }
  const ea = t.closest('[data-editarea]'); if (ea) return modalArea(area(ea.dataset.editarea));
  const ep = t.closest('[data-editproj]'); if (ep) return modalProj(projeto(ep.dataset.editproj));
  const ac = t.closest('[data-acao]'); if (!ac) return;
  const a = ac.dataset.acao;
  if (a !== 'excluirItem' && a !== 'excluirEv' && a !== 'excluirArea' && a !== 'excluirProj' && a !== 'excluirSerie') confirmar.ok = false;
  switch (a) {
    case 'fechar': return fecharModal();
    case 'entrar': return entrar();
    case 'sair': return sair();
    case 'salvarItem': return salvarItemModal();

const DOW = { sunday: 0, monday: 1, tuesday: 2, wednesday: 3, thursday: 4, friday: 5, saturday: 6, SU: 0, MO: 1, TU: 2, WE: 3, TH: 4, FR: 5, SA: 6 };
function recDeGraph(rec, inicio) {
  if (!rec || !rec.pattern) return null;
  const p = rec.pattern, r = { intervalo: p.interval || 1, ate: rec.range && rec.range.type === 'endDate' ? rec.range.endDate : '' };
  if (p.type === 'daily') r.freq = 'diaria';
  else if (p.type === 'weekly') { r.freq = 'semanal'; r.dias = (p.daysOfWeek || []).map(d => DOW[d]); }
  else if (p.type === 'absoluteMonthly') { r.freq = 'mensal'; r.modoMensal = 'dia'; r.diaMes = p.dayOfMonth; }
  else if (p.type === 'relativeMonthly') { r.freq = 'mensal'; r.modoMensal = 'posicao'; r.diaSemana = DOW[(p.daysOfWeek || [])[0]]; r.posicao = { first: 1, second: 2, third: 3, fourth: 4, last: -1 }[p.index] || 1; }
  else throw new Error('repetição anual ainda não é suportada');
  if (r.freq === 'semanal' && !r.dias.length) r.dias = [parseYmd(inicio).getDay()];
  return r;
}
function recDeGoogle(lst, inicio) {
  const rr = (lst || []).filter(x => x.startsWith('RRULE:'));
  if (!rr.length) return null;
  if (rr.length > 1) throw new Error('série com mais de uma regra de repetição');
  const k = Object.fromEntries(rr[0].slice(6).split(';').map(x => x.split('=')));
  const r = { intervalo: +k.INTERVAL || 1, ate: k.UNTIL ? `${k.UNTIL.slice(0, 4)}-${k.UNTIL.slice(4, 6)}-${k.UNTIL.slice(6, 8)}` : '' };
  const bd = (k.BYDAY || '').split(',').filter(Boolean);
  if (k.FREQ === 'DAILY') r.freq = 'diaria';
  else if (k.FREQ === 'WEEKLY') { r.freq = 'semanal'; r.dias = bd.length ? bd.map(d => DOW[d.slice(-2)]) : [parseYmd(inicio).getDay()]; }
  else if (k.FREQ === 'MONTHLY' && k.BYMONTHDAY) { r.freq = 'mensal'; r.modoMensal = 'dia'; r.diaMes = +k.BYMONTHDAY; }
  else if (k.FREQ === 'MONTHLY' && bd.length) { const m = bd[0].match(/^(-?\d)?([A-Z]{2})$/); r.freq = 'mensal'; r.modoMensal = 'posicao'; r.posicao = +(m[1] || k.BYSETPOS || 1); r.diaSemana = DOW[m[2]]; }
  else if (k.FREQ === 'MONTHLY') { r.freq = 'mensal'; r.modoMensal = 'dia'; r.diaMes = parseYmd(inicio).getDate(); }
  else throw new Error('repetição anual ainda não é suportada');
  return r;
}

document.addEventListener('pointerdown', ev => {

  if (!ev.target.closest('#view') || ev.target.closest('.ev.movel, button, input, select, a, textarea, .cal-head')) return;

document.addEventListener('pointermove', ev => {
  if (!swipe || (drag && drag.ativo)) return;
  const dx = ev.clientX - swipe.x, dy = ev.clientY - swipe.y;
  if (!swipe.ativo) { if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.5) { swipe.ativo = true; document.body.classList.add('arrastando'); } else if (Math.abs(dy) > 12) { swipe = null; return; } else return; }
  const el = alvoSwipe(); if (el) { el.style.transition = 'none'; el.style.transform = `translateX(${dx * 0.5}px)`; el.style.opacity = String(Math.max(.4, 1 - Math.abs(dx) / 600)); }

});

      if (mudouHora) { if (base.dia) { body.start = { date: primeiro }; body.end = { date: ymd(addDays(parseYmd(primeiro), 1)) }; } else { body.start = { dateTime: `${primeiro}T${ini}:00`, timeZone: GTZ }; body.end = { dateTime: `${dFim}T${fim}:00`, timeZone: GTZ }; } }

      if (mudouRec) body.recurrence = recorrenciaGraph({ recorrencia: rec, data: primeiro }, primeiro);

}
async function excluirSerie() {

/* ================= arrastar no calendário ================= */
let drag = null, suprimirClique = false;
const SNAP = 15;
document.addEventListener('pointerdown', ev => {
  const el = ev.target.closest('.ev.movel'); if (!el || ev.button !== 0) return;
  const col = el.closest('.col'); if (!col) return;
  drag = { el, col0: col, x0: ev.clientX, y0: ev.clientY, ini: +el.dataset.ini, dur: Math.max(+el.dataset.dur, 15), dia: el.dataset.dia,
    modo: ev.target.classList.contains('rs') ? 'tam' : 'mover', ativo: false, top0: el.offsetTop, h0: el.offsetHeight };
  el.setPointerCapture(ev.pointerId);
});
document.addEventListener('pointermove', ev => {
  if (!drag) return;
  const dx = ev.clientX - drag.x0, dy = ev.clientY - drag.y0;
  if (!drag.ativo) {
    if (Math.abs(dx) < 5 && Math.abs(dy) < 5) return;
    drag.ativo = true; drag.el.classList.add('arrastando'); document.body.classList.add('arrastando');
    if (drag.modo === 'mover') { drag.el.style.left = '1px'; drag.el.style.width = 'calc(100% - 3px)'; }
  }
  const passo = Math.round(dy / PX * 60 / SNAP) * SNAP;
  if (drag.modo === 'tam') {
    drag.novaDur = Math.max(15, Math.min(drag.dur + passo, H1 * 60 - drag.ini));
    drag.el.style.height = (drag.novaDur / 60 * PX - 2) + 'px';
    drag.el.querySelector('b').textContent = `${min2hm(drag.ini)}–${min2hm(drag.ini + drag.novaDur)}`;
  } else {
    drag.novoIni = Math.max(H0 * 60, Math.min(drag.ini + passo, H1 * 60 - 15));
    // coluna sob o ponteiro
    const alvo = $$('.wk .col').find(c => { const r = c.getBoundingClientRect(); return ev.clientX >= r.left && ev.clientX < r.right; });
    if (alvo && alvo !== drag.el.parentElement) alvo.appendChild(drag.el);
    drag.novoDia = (alvo || drag.el.parentElement).dataset.coldia;
    drag.el.style.top = ((drag.novoIni - H0 * 60) / 60 * PX) + 'px';
    drag.el.querySelector('b').textContent = min2hm(drag.novoIni);
  }
});
document.addEventListener('pointerup', async ev => {
  if (!drag) return;
  const d = drag; drag = null;
  document.body.classList.remove('arrastando');
  if (!d.ativo) return; // foi um clique: o handler de click abre o item
  suprimirClique = true; setTimeout(() => suprimirClique = false, 50);
  const novoDia = d.novoDia || d.dia, novoIni = d.novoIni ?? d.ini, novaDur = d.novaDur ?? d.dur;
  if (novoDia === d.dia && novoIni === d.ini && novaDur === d.dur) return render();
  await moverNoCalendario(d.el, novoDia, novoIni, novaDur, d.dia);
});
async function moverNoCalendario(el, dia, ini, dur, diaAntigo) {
  if (el.dataset.ev) {
    const e = eventos.find(x => x.id === el.dataset.ev); if (!e) return render();
    const fimMin = ini + dur, d2 = fimMin >= 1440 ? ymd(addDays(parseYmd(dia), 1)) : dia;
    const st = `${dia}T${min2hm(ini)}:00`, en = `${d2}T${min2hm(fimMin % 1440)}:00`;
    const antes = { s: e.start.dateTime, f: e.end.dateTime };
    e.start.dateTime = st; e.end.dateTime = en; render();
    try {
      if (e._cal.fonte === 'google') await gapi('PATCH', gEv(e._cal.id, e.rawId), { start: { dateTime: st, timeZone: GTZ }, end: { dateTime: en, timeZone: GTZ } });
      else await graph('PATCH', `${calPath(e._cal.id)}/events/${e.id}`, { start: { dateTime: st, timeZone: D.config.fuso }, end: { dateTime: en, timeZone: D.config.fuso } });
      toast('Evento atualizado.');
    } catch (er) { e.start.dateTime = antes.s; e.end.dateTime = antes.f; render(); toast('Não consegui mover: ' + er.message, true); }
    return;
  }
  const it = D.itens.find(i => i.id === el.dataset.item); if (!it) return render();
  if (!it.recorrencia) {
    it.data = dia; it.hora = min2hm(ini); it.duracao = dur; if (it.outlook) it._pend = true; salvar(); render();
    if (it.sincronizar || it.outlook) { await sincronizar(it); salvar(); faixaEventos = ''; render(); }
    return;
  }
  // rotina: perguntar
  const orig = el.dataset.orig;
  abrirModal(`<h3>Mover "${esc(it.titulo)}"</h3>
    <p>De <b>${fmtData(diaAntigo)}</b> para <b>${fmtData(dia)} ${min2hm(ini)}–${min2hm(ini + dur)}</b>.</p><p class="hint">É uma rotina que se repete. O que você quer alterar?</p>
    <div class="acts"><button class="btn l" data-acao="fechar">Cancelar</button><button class="btn" data-mover="um">Só este dia</button><button class="btn pri" data-mover="serie">Toda a série</button></div>`);
  moverNoCalendario._p = { it, orig, dia, ini, dur, diaAntigo };
}
async function confirmarMover(qual) {
  const { it, orig, dia, ini, dur, diaAntigo } = moverNoCalendario._p; fecharModal();
  if (qual === 'um') {
    it.excecoes = it.excecoes || {};
    it.excecoes[orig] = { data: dia, hora: min2hm(ini), duracao: dur };
    if (it.outlook) it._pend = true;
    salvar(); render();
    if (it.sincronizar && it.outlook) { try { await moverInstancia(it, orig, dia, ini, dur); delete it._pend; toast('Agenda atualizada (só este dia).'); } catch (e) { toast('Agenda: ' + e.message, true); } salvar(); faixaEventos = ''; render(); }
    return;
  }
  // série: muda horário/duração; se mudou de dia, desloca os dias da repetição
  const delta = diffDays(parseYmd(diaAntigo), parseYmd(dia)), r = it.recorrencia;
  it.hora = min2hm(ini); it.duracao = dur;
  if (delta) {
    it.data = ymd(addDays(parseYmd(it.data), delta));
    if (r.freq === 'semanal') r.dias = (r.dias && r.dias.length ? r.dias : [parseYmd(diaAntigo).getDay()]).map(x => ((x + delta) % 7 + 7) % 7);
    if (r.freq === 'mensal' && r.modoMensal !== 'posicao') r.diaMes = Math.min(31, Math.max(1, (+r.diaMes || 1) + delta));
    if (r.freq === 'mensal' && r.modoMensal === 'posicao') r.diaSemana = ((+r.diaSemana + delta) % 7 + 7) % 7;
  }
  it.excecoes = {};
  if (it.outlook) it._pend = true;
  salvar(); render();
  if (it.sincronizar || it.outlook) { await sincronizar(it); salvar(); faixaEventos = ''; render(); }
}
async function moverInstancia(it, orig, dia, ini, dur) {
  const cal = it.outlook.calendarId, off = tzOff();
  const a = `${orig}T00:00:00${off}`, b = `${ymd(addDays(parseYmd(orig), 1))}T00:00:00${off}`;
  const fimMin = ini + dur, d2 = fimMin >= 1440 ? ymd(addDays(parseYmd(dia), 1)) : dia;
  const st = `${dia}T${min2hm(ini)}:00`, en = `${d2}T${min2hm(fimMin % 1440)}:00`;
  if (ehG(cal)) {
    const j = await gapi('GET', `${gEv(cal, it.outlook.eventId)}/instances?timeMin=${encodeURIComponent(a)}&timeMax=${encodeURIComponent(b)}`);
    const inst = (j.items || [])[0]; if (!inst) throw new Error('ocorrência não encontrada no Google');
    await gapi('PATCH', gEv(cal, inst.id), { start: { dateTime: st, timeZone: GTZ }, end: { dateTime: en, timeZone: GTZ } });
  } else {
    const j = await graph('GET', `${calPath(cal)}/events/${it.outlook.eventId}/instances?startDateTime=${encodeURIComponent(a)}&endDateTime=${encodeURIComponent(b)}&$select=id`);
    const inst = (j.value || [])[0]; if (!inst) throw new Error('ocorrência não encontrada no Outlook');
    await graph('PATCH', `${calPath(cal)}/events/${inst.id}`, { start: { dateTime: st, timeZone: D.config.fuso }, end: { dateTime: en, timeZone: D.config.fuso } });
  }
}

/* ================= lembretes ================= */
function pedirNotif() { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); }
function notificar(tit, txt) {
  toast(`${tit}: ${txt}`);
  if ('Notification' in window && Notification.permission === 'granted') { try { new Notification(tit, { body: txt }); } catch { } }
  else pedirNotif();
}
const avisados = new Set();
function verificarLembretes() {
  if (!D.config.notificacoes) return;
  const n = new Date(), hs = ymd(n), agora = n.getHours() * 60 + n.getMinutes();
  D.itens.forEach(it => {
    if (!it.hora || (it.sincronizar && it.outlook)) return;
    if (!ocorrencias(it, hoje0(), hoje0()).length || it.concluidas[hs]) return;
    const ini = hm2min(it.hora), k = it.id + hs;
    if (agora >= ini - (+it.lembrete || 0) && agora <= ini && !avisados.has(k)) {
      avisados.add(k);
      const p = projeto(it.projetoId);
      notificar(`${it.hora} · ${it.titulo}`, [area(it.areaId) && area(it.areaId).nome, p && p.nome].filter(Boolean).join(' · ') || 'Lembrete');
    }
  });
}
